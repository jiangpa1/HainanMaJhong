# http context: /etc/nginx/conf.d/00-records-gzip-log.conf
# Only record metrics; never log Authorization, cookies, query strings or JSON.
log_format records_gzip escape=json
  '{"time":"$time_iso8601","uri":"$uri","status":$status,'
  '"bodyBytes":$body_bytes_sent,"httpBytes":$bytes_sent,'
  '"gzipRatio":"$gzip_ratio","encoding":"$sent_http_content_encoding",'
  '"requestSeconds":$request_time,"upstreamSeconds":"$upstream_response_time"}';
