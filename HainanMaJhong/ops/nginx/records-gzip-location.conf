# Include INSIDE the Mahjong server block. Keep the existing / WebSocket proxy.
location ~ ^/api/(?:v2/)?records(?:/|$) {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Nginx owns compression; avoid double compression at the upstream.
    proxy_set_header Accept-Encoding "";

    gzip on;
    gzip_types application/json;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied no-cache no-store private auth;

    # Authenticated records must never enter a shared proxy/CDN cache.
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store" always;
    access_log /var/log/nginx/records-gzip.log records_gzip;
}
