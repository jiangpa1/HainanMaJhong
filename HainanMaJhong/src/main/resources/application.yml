spring:
  # MySQL 配置（凭据与主机均走环境变量，不写死到仓库）
  #   可选环境变量：
  #     DB_URL      完整 JDBC URL（默认本机 hainan_majong 库）
  #     DB_USERNAME 数据库账号（默认 root）
  #     DB_PASSWORD 数据库密码（默认空）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hainan_majong?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 启动时不校验连接，避免数据库未启动导致应用起不来（首次查询才真正连接）
      initialization-fail-timeout: -1

  # Redis 配置（Spring Boot 2.7 用 spring.redis 前缀，不是 spring.data.redis）
  #   可选环境变量：REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
