# ============================================================================
#  公共配置（所有环境共用）—— 环境相关的东西在 application-<profile>.yml 里
#
#  profile 怎么选：
#    本地开发   默认就是 local，不用做任何事
#    云端       SPRING_PROFILES_ACTIVE=prod
#               或  java -jar app.jar --spring.profiles.active=prod
#
#  写成 ${SPRING_PROFILES_ACTIVE:local} 是为了让云端只用环境变量就能切，
#  既不用改这个文件，也不用在命令行多敲参数。
# ============================================================================

# 1. 服务端口配置（各 profile 里可以用 SERVER_PORT 覆盖）
server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true

# 2. Spring 基础配置
spring:
  application:
    name: HainanMahjong # 项目名称
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# 3. MyBatis-Plus 核心配置
# 注意：用的是 MyBatis-Plus，配置前缀必须是 mybatis-plus，写成 mybatis 不会生效
mybatis-plus:
  # Mapper XML 文件的存放路径（对应 src/main/resources/mapper/ 目录）
  mapper-locations: classpath:mapper/*.xml

  # 实体类所在的包路径（配置后，XML 里的 resultType 可以简写类名，不用写全路径）
  type-aliases-package: hainanMahjong.pojo

  # SQL 日志开关【故意不写在这里】，而是下放到各 profile：
  #   application-local.yml —— StdOutImpl，开发时能看到每条 SQL 和参数
  #   application-prod.yml  —— NoLoggingImpl，生产禁止把 SQL/参数（含按用户名查密码）打进日志
  configuration:
    # 开启驼峰命名映射（数据库的 user_name 自动映射为 Java 的 userName）
    map-underscore-to-camel-case: true

# 容量监控只监听回环地址，通过 SSH 隧道或本机 Prometheus 采集。
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: 127.0.0.1
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      enabled: true
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: HainanMahjong
    distribution:
      percentiles-histogram:
        jvm.gc.pause: true
        hikaricp.connections.acquire: true

# Initial per-process budgets for the current 2-vCPU deployment, not measured capacity claims.
# Restart to apply changes; disabling this switch restores prior HTTP admission behavior.
traffic-protection:
  enabled: ${TRAFFIC_PROTECTION_ENABLED:true}
  max-keys: ${TRAFFIC_MAX_KEYS:10000}
  idle-seconds: 600
  busy-retry-seconds: 2
  trusted-proxies: ${TRAFFIC_TRUSTED_PROXIES:127.0.0.1,::1}
  login:
    concurrency: ${LOGIN_MAX_CONCURRENT:1}
    global: { per-second: '${LOGIN_RPS:3}', burst: '${LOGIN_BURST:3}' }
    principal: { per-second: '${LOGIN_ACCOUNT_RPS:0.1}', burst: '${LOGIN_ACCOUNT_BURST:3}' }
    ip: { per-second: '${LOGIN_IP_RPS:1}', burst: '${LOGIN_IP_BURST:10}' }
  records:
    concurrency: ${RECORDS_MAX_CONCURRENT:48}
    global: { per-second: '${RECORDS_RPS:800}', burst: '${RECORDS_BURST:100}' }
    principal: { per-second: '${RECORDS_USER_RPS:8}', burst: '${RECORDS_USER_BURST:16}' }
    ip: { per-second: '${RECORDS_IP_RPS:480}', burst: '${RECORDS_IP_BURST:60}' }
  legacy:
    concurrency: ${LEGACY_RECORDS_MAX_CONCURRENT:8}
    global: { per-second: '${LEGACY_RECORDS_RPS:20}', burst: '${LEGACY_RECORDS_BURST:4}' }
    principal: { per-second: '${LEGACY_RECORDS_USER_RPS:0.5}', burst: '${LEGACY_RECORDS_USER_BURST:2}' }
    ip: { per-second: '${LEGACY_RECORDS_IP_RPS:12}', burst: '${LEGACY_RECORDS_IP_BURST:3}' }

game:
  push:
    default-mode: ${PUSH_DEFAULT:full}

# Writes remain enabled when the worker is paused; pending jobs survive process restarts.
room-close-outbox:
  worker-enabled: ${ROOM_CLOSE_OUTBOX_WORKER_ENABLED:true}

capacity:
  sample-ms: 10000
  external-probes-enabled: ${CAPACITY_EXTERNAL_PROBES_ENABLED:false}
  network-interface: ${CAPACITY_NETWORK_INTERFACE:eth0}

# P2: dual-write first; indexed reads require a successful migration promote operation.
records:
  p2:
    write-enabled: ${RECORDS_P2_WRITE_ENABLED:true}
    read-enabled: ${RECORDS_P2_READ_ENABLED:false}
    cache:
      enabled: ${RECORDS_P2_CACHE_ENABLED:true}
      max-entries: 512
      max-item-bytes: 65536
      max-bytes: 8388608
      ttl-ms: 60000
