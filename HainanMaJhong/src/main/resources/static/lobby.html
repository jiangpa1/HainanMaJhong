<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>海南麻将 · 大厅</title>
<link rel="stylesheet" href="landscape.css?v=20260907g">
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f0d27a;
    --gold-deep: #a8842a;
    --ink: #f5e6c8;
  }
  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    /* 深绿色中国风背景（多层渐变模拟丝绸纹理） */
    background:
      radial-gradient(1100px 620px at 50% 18%, rgba(52,122,82,.38), rgba(52,122,82,0) 62%),
      radial-gradient(800px 500px at 12% 88%, rgba(30,90,60,.30), rgba(30,90,60,0) 60%),
      radial-gradient(800px 500px at 88% 88%, rgba(30,90,60,.30), rgba(30,90,60,0) 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.016) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg, #0f3d2a 0%, #0a2e20 50%, #062018 100%);
  }
  /* 金色包边画框 */
  body::before {
    content: "";
    position: fixed; inset: 10px;
    border: 2px solid rgba(212,175,55,.40);
    border-radius: 18px;
    pointer-events: none;
    z-index: 999;
    box-shadow: inset 0 0 30px rgba(0,0,0,.35);
  }

  /* ===== 顶部用户信息区（半透明黑窄条） ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 22px;
    background: rgba(0,0,0,.42);
    backdrop-filter: blur(4px);
    border-bottom: 1px solid rgba(212,175,55,.5);
    z-index: 10;
  }
  .user { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    flex: 0 0 auto;
    /* 圆形头像占位符（可替换为 <img>） */
    background: linear-gradient(180deg, #f0d27a, #c9a227 55%, #8a6a1e);
    border: 2px solid var(--gold-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #3a2a06;
    box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.5);
  }
  .nick {
    font-size: 18px; font-weight: bold; letter-spacing: 1px;
    color: #f7ecd0;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }
  .logout { color: rgba(255,255,255,.66); text-decoration: none; font-size: 13px; }
  .logout:hover { color: var(--gold-light); }

  /* ===== 核心操作区 ===== */
  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    align-content: center;
    gap: 26px;
    padding: 70px 24px 150px;
    position: relative; z-index: 5;
  }
  .logo {
    font-size: 50px; font-weight: 900; letter-spacing: 8px; text-indent: 8px;
    background: linear-gradient(180deg, #fff6cf, #e8c76a 55%, #b8860b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.5));
  }

  /* 通用按钮：金色包边 + 拟物底部厚边 + 扁平渐变 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 3px solid var(--gold-light);
    border-radius: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    text-decoration: none;
    color: #fff;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover { transform: scale(1.05); filter: brightness(1.07); }
  .btn:active { transform: scale(.96) translateY(5px); }

  /* 快速开始：最大、橙红渐变 + 发光 */
  .btn-quick {
    font-size: 46px;
    padding: 26px 96px;
    background: linear-gradient(180deg, #ff9a3d 0%, #f2572e 52%, #d92b1f 100%);
    box-shadow:
      0 10px 0 #a31f16,
      0 20px 34px rgba(0,0,0,.55),
      0 0 48px rgba(255,120,40,.50);
    text-shadow: 0 2px 4px rgba(0,0,0,.55);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .btn-quick:active { box-shadow: 0 4px 0 #a31f16, 0 10px 16px rgba(0,0,0,.5), 0 0 30px rgba(255,120,40,.4); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 10px 0 #a31f16, 0 20px 34px rgba(0,0,0,.55), 0 0 30px rgba(255,120,40,.35); }
    50%      { box-shadow: 0 10px 0 #a31f16, 0 20px 34px rgba(0,0,0,.55), 0 0 62px rgba(255,140,50,.70); }
  }

  /* 下方两个并排按钮（两列 Grid） */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    width: min(540px, 90%);
  }
  .btn-create, .btn-join {
    font-size: 23px;
    padding: 16px 0;
    width: 100%;
    box-shadow: 0 7px 0 rgba(0,0,0,.35), 0 12px 22px rgba(0,0,0,.45);
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .btn-create {
    background: linear-gradient(180deg, #46d17e 0%, #28ab60 55%, #1b7d45 100%);
    box-shadow: 0 7px 0 #145c32, 0 12px 22px rgba(0,0,0,.45);
  }
  .btn-join {
    background: linear-gradient(180deg, #4ba6e8 0%, #2f7fc0 55%, #1f5d94 100%);
    box-shadow: 0 7px 0 #16486f, 0 12px 22px rgba(0,0,0,.45);
  }

  /* ===== 底部功能区（缩小放边角） ===== */
  .dock {
    position: fixed; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 28px;
    z-index: 10;
    pointer-events: none;
  }
  .icon-btn {
    pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
    color: #f2e5c8; font-size: 12px; font-weight: bold; letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .icon-btn .icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    background: linear-gradient(180deg, rgba(240,210,122,.28), rgba(120,90,20,.24));
    border: 2px solid rgba(212,175,55,.75);
    box-shadow: 0 3px 9px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.18);
    transition: transform .15s ease, filter .15s ease;
  }
  .icon-btn:hover .icon { transform: scale(1.12); filter: brightness(1.15); }
  .icon-btn:active .icon { transform: scale(.92); }

  /* ===== 返回房间（中途离开对局时可回到原房间） ===== */
  .return-room {
    position: fixed; left: 50%; bottom: 104px;
    transform: translateX(-50%);
    z-index: 20;
    display: none;
    align-items: center; gap: 8px;
    border: none; cursor: pointer;
    color: #fff; font-size: 16px; font-weight: 900; letter-spacing: 1px;
    padding: 12px 30px;
    border-radius: 14px;
    background: linear-gradient(180deg, #4ba6e8 0%, #2f7fc0 55%, #1f5d94 100%);
    box-shadow: 0 6px 0 #16486f, 0 12px 20px rgba(0,0,0,.45);
  }
  .return-room.show { display: inline-flex; animation: returnPulse 2s ease-in-out infinite; }
  @keyframes returnPulse {
    0%, 100% { box-shadow: 0 6px 0 #16486f, 0 12px 20px rgba(0,0,0,.45), 0 0 0 rgba(255,255,255,0); }
    50%      { box-shadow: 0 6px 0 #16486f, 0 12px 20px rgba(0,0,0,.45), 0 0 22px rgba(120,190,255,.9); }
  }

  /* 轻提示 toast */
  .toast {
    position: fixed; top: 74px; left: 50%; transform: translate(-50%, -12px);
    background: rgba(0,0,0,.72); color: #f7ecd0;
    padding: 9px 20px; border-radius: 10px; font-size: 14px;
    border: 1px solid rgba(212,175,55,.6);
    opacity: 0; transition: opacity .25s, transform .25s; z-index: 1000; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 设置面板 ===== */
  .settings-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center;
  }
  .settings-overlay.open { display: flex; }
  .settings-dialog {
    width: 320px; max-width: 90vw;
    background: linear-gradient(180deg, rgba(30,70,55,.95), rgba(14,40,30,.97));
    border: 1px solid rgba(212,175,55,.55);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.55);
    overflow: hidden;
    transform: scale(.7); opacity: 0;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), opacity .18s;
  }
  .settings-overlay.open .settings-dialog { transform: scale(1); opacity: 1; }
  .settings-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; font-size: 17px; font-weight: bold; color: var(--ink);
    border-bottom: 1px solid rgba(212,175,55,.3);
  }
  .settings-close {
    width: 30px; height: 30px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 17px; color: #fff; background: rgba(0,0,0,.3);
  }
  .settings-close:hover { background: rgba(0,0,0,.5); }
  .settings-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .setting-item {
    padding: 13px 16px; border-radius: 10px; text-align: center;
    font-size: 15px; font-weight: bold; color: var(--ink); cursor: pointer;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    transition: background .15s;
  }
  .setting-item:hover { background: rgba(247,215,116,.2); }
  .setting-item.danger { color: #ff9d8e; }
  .form-label { font-size: 13px; opacity: .75; margin-top: 2px; }
  .setting-input {
    background: rgba(0,0,0,.32);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 9px; padding: 11px 13px;
    font-size: 15px; color: #fff; outline: none;
  }
  .setting-input:focus { border-color: var(--gold-light); }
  .setting-save {
    margin-top: 4px; border: none; border-radius: 10px; padding: 12px;
    font-size: 15px; font-weight: 900; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ffb03a, #d97a14);
    box-shadow: 0 4px 0 #a35a10, 0 6px 12px rgba(0,0,0,.4);
  }
  .setting-save:active { transform: translateY(3px); box-shadow: 0 1px 0 #a35a10; }
  .setting-back {
    margin-top: 2px; background: none; border: none; cursor: pointer;
    font-size: 13px; color: rgba(255,255,255,.6); padding: 6px;
  }
  .setting-back:hover { color: var(--ink); }

  /* ===== 响应式 ===== */
  @media (max-width: 640px) {
    .logo { font-size: 38px; letter-spacing: 4px; }
    .btn-quick { font-size: 34px; padding: 20px 60px; }
    .btn-row { gap: 20px; }
    .btn-create, .btn-join { font-size: 21px; padding: 14px 30px; }
  }
</style>
</head>
<body>

<!-- 顶部用户信息区 -->
<header class="top-bar">
  <div class="user">
    <div class="avatar">雀</div>
    <span class="nick" id="nick">海南雀神</span>
  </div>
</header>

<!-- 核心操作区 -->
<main class="stage">
  <div class="logo">海南麻将</div>
  <a class="btn btn-quick" href="game.html" data-landscape>快速开始</a>
  <div class="btn-row">
    <button class="btn btn-create" type="button" onclick="createRoom()">创建房间</button>
    <button class="btn btn-join" type="button" onclick="joinRoomPrompt()">加入房间</button>
  </div>
</main>

<!-- 底部功能区 -->
<footer class="dock">
  <button class="icon-btn" onclick="openSettings()"><span class="icon">⚙</span>设置</button>
  <button class="icon-btn" onclick="location.href='records.html'"><span class="icon">🏆</span>战绩查询</button>
</footer>

<button class="return-room" id="return-room">↩ 返回房间</button>

<!-- 设置面板 -->
<div class="settings-overlay" id="settings-overlay">
  <div class="settings-dialog">
    <div class="settings-title">设置 <button class="settings-close" id="settings-close">×</button></div>
    <div class="settings-body" id="settings-body"></div>
  </div>
</div>

<script>
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 260); }, 1500);
}

// 显示登录昵称
const savedNick = localStorage.getItem('nickname') || localStorage.getItem('username');
if (savedNick) document.getElementById('nick').textContent = savedNick;

// ===== 设置面板 =====
function openSettings(){
  document.getElementById('settings-body').innerHTML = defaultMenu();
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings(){
  document.getElementById('settings-overlay').classList.remove('open');
}
document.getElementById('settings-close').addEventListener('click', closeSettings);
document.getElementById('settings-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('settings-overlay')) closeSettings();
});

function defaultMenu(){
  return `<div class="setting-item" onclick="showNicknameForm()">修改昵称</div>
    <div class="setting-item" onclick="showPasswordForm()">修改密码</div>
    <div class="setting-item danger" onclick="logout()">退出登录</div>`;
}

function showNicknameForm(){
  const nick = localStorage.getItem('nickname') || localStorage.getItem('username') || '';
  document.getElementById('settings-body').innerHTML = `
    <div class="form-label">新昵称</div>
    <input class="setting-input" id="nick-input" maxlength="16" value="${nick}" placeholder="输入昵称">
    <button class="setting-save" onclick="saveNickname()">保存</button>
    <button class="setting-back" onclick="openSettings()">‹ 返回</button>`;
}

async function saveNickname(){
  const nick = document.getElementById('nick-input').value.trim();
  if (!nick) { toast('昵称不能为空'); return; }
  const userId = localStorage.getItem('userId') || '0';
  try {
    const res = await fetch('/api/user/nickname', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId: parseInt(userId), nickname: nick}) });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('nickname', data.nickname || nick);
      document.getElementById('nick').textContent = data.nickname || nick;
      toast('昵称已更新');
      closeSettings();
    } else {
      toast(data.message || '修改失败');
    }
  } catch (e) { toast('网络错误'); }
}

function showPasswordForm(){
  document.getElementById('settings-body').innerHTML = `
    <div class="form-label">原密码</div>
    <input class="setting-input" id="old-pwd" type="password" placeholder="输入原密码">
    <div class="form-label">新密码</div>
    <input class="setting-input" id="new-pwd" type="password" placeholder="至少 6 位">
    <button class="setting-save" onclick="savePassword()">保存</button>
    <button class="setting-back" onclick="openSettings()">‹ 返回</button>`;
}

async function savePassword(){
  const oldPwd = document.getElementById('old-pwd').value;
  const newPwd = document.getElementById('new-pwd').value;
  if (!oldPwd || !newPwd) { toast('请填写完整'); return; }
  const userId = localStorage.getItem('userId') || '0';
  try {
    const res = await fetch('/api/user/password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId: parseInt(userId), oldPassword: oldPwd, newPassword: newPwd}) });
    const data = await res.json();
    if (data.success) {
      toast('密码已修改');
      closeSettings();
    } else {
      toast(data.message || '修改失败');
    }
  } catch (e) { toast('网络错误'); }
}

function requireLogin(){
  const uid = localStorage.getItem('userId');
  if (!uid || uid === '0') {
    toast('请先登录账号，游客不能进入联机房间');
    setTimeout(() => location.href = 'index.html', 900);
    return false;
  }
  return true;
}

let returnInfo = null;
function refreshReturn(){
  const uid = localStorage.getItem('userId');
  const btn = document.getElementById('return-room');
  if (!uid || uid === '0') {
    if (btn) btn.classList.remove('show');
    returnInfo = null;
    return;
  }
  fetch('/api/room/pending?userId=' + encodeURIComponent(uid))
    .then(r => r.json())
    .then(d => {
      if (d && d.exists && d.code) {
        returnInfo = d;
        if (btn) btn.classList.add('show');
      } else {
        returnInfo = null;
        if (btn) btn.classList.remove('show');
      }
    })
    .catch(() => {});
}
function goReturnRoom(){
  if (!returnInfo || !returnInfo.code) return;
  if (returnInfo.state === 'PLAYING') {
    localStorage.setItem('roomCode', returnInfo.code);
    location.href = 'game.html?mode=multi&code=' + encodeURIComponent(returnInfo.code)
      + '&seat=' + encodeURIComponent(returnInfo.seat || 'EAST');
  } else {
    location.href = 'room.html?action=join&code=' + encodeURIComponent(returnInfo.code);
  }
}

function createRoom(){
  if (!requireLogin()) return;
  location.href = 'room.html?action=create';
}

function joinRoomPrompt(){
  if (!requireLogin()) return;
  const input = prompt('请输入 6 位房间码', '');
  if (input == null) return;
  const code = input.trim();
  if (!/^\d{6}$/.test(code)) {
    toast('房间码应为 6 位数字');
    return;
  }
  location.href = 'room.html?action=join&code=' + code;
}

function logout(){
  localStorage.removeItem('username');
  localStorage.removeItem('userId');
  localStorage.removeItem('nickname');
  localStorage.removeItem('roomId');
  location.href = 'index.html';
}

// 有可返回的房间时显示蓝色按钮（放在声明之后调用，避免 TDZ 报错）
document.getElementById('return-room').addEventListener('click', goReturnRoom);
refreshReturn();
setInterval(refreshReturn, 8000);
</script>
<script src="landscape.js?v=20260907g"></script>
</body>
</html>
