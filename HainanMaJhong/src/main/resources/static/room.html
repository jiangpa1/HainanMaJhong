<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>海南麻将 · 房间</title>
<link rel="stylesheet" href="landscape.css?v=20260907l">
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f0d27a;
    --ink: #f5e6c8;
    --green: #12382b;
    --green-dark: #0a2e20;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--ink);
    overflow: hidden;
    user-select: none;
    background:
      radial-gradient(1100px 620px at 50% 18%, rgba(52,122,82,.38), rgba(52,122,82,0) 62%),
      linear-gradient(180deg, #0f3d2a 0%, #0a2e20 50%, #062018 100%);
  }
  #game-app {
    background: transparent;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: rgba(0,0,0,.42);
    border-bottom: 1px solid rgba(212,175,55,.5);
  }
  header .back {
    background: none; border: none; cursor: pointer;
    color: var(--ink); font-size: 15px; font-weight: bold; opacity: .85;
  }
  header .back:hover { opacity: 1; }
  header .t { font-size: 20px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(180deg, #fff6cf, #e8c76a 55%, #b8860b);
    -webkit-background-clip: text; background-clip: text; color: transparent; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .code-box {
    width: min(420px, 94%);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.2));
    border: 2px solid rgba(212,175,55,.6);
    border-radius: 16px;
    padding: 14px 18px;
    text-align: center;
  }
  .code-label { font-size: 13px; opacity: .7; letter-spacing: 2px; }
  .code {
    font-size: 40px; font-weight: 900; letter-spacing: 8px;
    color: var(--gold-light);
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 12px; opacity: .6; margin-top: 8px; }

  .panel {
    width: min(420px, 94%);
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.18));
    border: 1px solid rgba(212,175,55,.35);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .panel-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; }
  ul.members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li.member {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 9px 12px;
  }
  li.member .wind {
    flex: 0 0 auto;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900;
    background: rgba(0,0,0,.3);
  }
  li.member .name { flex: 1; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.member .host-tag {
    flex: 0 0 auto; font-size: 12px; padding: 2px 8px; border-radius: 10px;
    color: #3a2a06; font-weight: 900;
    background: linear-gradient(180deg, #f0d27a, #c9a227);
  }
  li.member.you { border-color: rgba(247,215,116,.7); }

  .status { font-size: 14px; opacity: .85; text-align: center; min-height: 20px; }
  .btn-row2 { display: flex; gap: 14px; justify-content: center; }
  .btn-act {
    border: none; cursor: pointer;
    border-radius: 12px;
    padding: 12px 26px;
    font-size: 16px; font-weight: 900; color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
  }
  .btn-leave { background: linear-gradient(180deg, #6a7680, #4a535c); box-shadow: 0 4px 0 #2e353b; }
  .btn-rematch { background: linear-gradient(180deg, #46d17e, #1b7d45); box-shadow: 0 4px 0 #145c32; display: none; }
  .toast {
    position: fixed; top: 70px; left: 50%; transform: translate(-50%, -10px);
    background: rgba(0,0,0,.78); color: #f7ecd0;
    padding: 9px 18px; border-radius: 10px; font-size: 14px;
    border: 1px solid rgba(212,175,55,.6);
    opacity: 0; transition: opacity .2s, transform .2s;
    z-index: 2000; pointer-events: none;
    max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <button class="back" id="back">‹ 大厅</button>
  <span class="t">房间</span>
</header>

<main>
  <div class="code-box">
    <div class="code-label">房间码</div>
    <div class="code" id="code">------</div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="panel">
    <div class="panel-title">成员（<span id="cnt">0</span>/4）</div>
    <ul class="members" id="members"></ul>
  </div>

  <div class="status" id="status">连接中…</div>

  <div class="btn-row2">
    <button class="btn-act btn-rematch" id="rematch-btn">开始下一轮（打满四风）</button>
    <button class="btn-act btn-leave" id="leave-btn">离开房间</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
const userId = localStorage.getItem('userId') || '0';
const nickname = localStorage.getItem('nickname') || localStorage.getItem('username') || '玩家';
if (!userId || userId === '0') {
  location.href = 'index.html';
}
const params = new URLSearchParams(location.search);
const action = params.get('action') || (params.get('code') ? 'join' : '');
const wantCode = (params.get('code') || '').trim();

const codeEl = document.getElementById('code');
const cntEl = document.getElementById('cnt');
const membersEl = document.getElementById('members');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const rematchBtn = document.getElementById('rematch-btn');
const leaveBtn = document.getElementById('leave-btn');

let roomCode = '';
let isHost = false;
let left = false;

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
}
function toLobby(){
  left = true;
  location.href = 'lobby.html';
}
function goBack(){
  if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify({type:'leaveRoom'})); } catch (e) {} }
  toLobby();
}
document.getElementById('back').addEventListener('click', goBack);
leaveBtn.addEventListener('click', goBack);

const wsProto = (location.protocol === 'https:') ? 'wss' : 'ws';
const ws = new WebSocket(wsProto + '://' + location.host + '/room?userId=' + userId);
ws.onopen = () => {
  statusEl.textContent = '已连接';
  if (action === 'create') {
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem('hnRoomConfig') || 'null'); } catch (e) { cfg = null; }
    ws.send(JSON.stringify({ type: 'createRoom', config: (cfg && typeof cfg === 'object') ? cfg : {} }));
  } else if (wantCode) {
    ws.send(JSON.stringify({ type: 'joinRoom', code: wantCode }));
  } else {
    toast('缺少房间码');
    setTimeout(toLobby, 700);
  }
};
ws.onmessage = (e) => {
  let msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
  handle(msg);
};
ws.onclose = () => {
  if (left) return;
  statusEl.textContent = '连接已断开';
};

function handle(msg){
  switch (msg.type) {
    case 'room_info':
      render(msg);
      break;
    case 'start':
      // 4 人已齐：跳去牌桌连接 /game
      left = true;
      localStorage.setItem('roomCode', msg.code);
      location.href = 'game.html?mode=multi&code=' + encodeURIComponent(msg.code)
        + '&seat=' + encodeURIComponent(msg.seat || 'EAST');
      break;
    case 'join_denied':
      toast(msg.reason || '无法加入');
      setTimeout(toLobby, 900);
      break;
    case 'room_closed':
      toast(msg.reason || '房间已解散');
      setTimeout(toLobby, 900);
      break;
  }
}

function render(info){
  roomCode = info.code;
  isHost = Number(info.hostUserId) === Number(userId);
  codeEl.textContent = roomCode;
  localStorage.setItem('roomCode', roomCode);
  const members = info.members || [];
  cntEl.textContent = members.length;
  const WIN = {EAST:'东', SOUTH:'南', WEST:'西', NORTH:'北'};
  membersEl.innerHTML = members.map(m => {
    const you = Number(m.userId) === Number(userId) ? ' you' : '';
    const host = Number(m.userId) === Number(info.hostUserId) ? '<span class="host-tag">房主</span>' : '';
    return '<li class="member' + you + '">'
      + '<span class="wind">' + (WIN[m.seat] || '?') + '</span>'
      + '<span class="name">' + esc(m.nickname || ('玩家' + m.userId)) + '</span>' + host
      + '</li>';
  }).join('');
  if (isHost) {
    hintEl.textContent = members.length < 4 ? '把房间码分享给好友，凑齐 4 人自动开局' : '已满 4 人';
  } else {
    hintEl.textContent = '等待房主开局…';
  }
  statusEl.textContent = members.length >= 4 ? '成员已满' : ('等待成员加入（' + members.length + '/4）');
  rematchBtn.style.display = 'none';
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
<script src="landscape.js?v=20260907l"></script>
</body>
</html>
