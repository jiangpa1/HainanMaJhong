<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>海南麻将 · 人机对战</title>
<link rel="stylesheet" href="landscape.css?v=20260908a">
<style>
  :root {
    --gold: #f7d774;
    --gold-deep: #c9a227;
    --felt: #14503a;
    --felt-dark: #0d3728;
    --tile-w: 52px;      /* 手牌宽度（可调） */
    --tile-h: 68px;
    --tile-w-s: 26px;    /* 小牌宽度 */
    --tile-h-s: 34px;
  }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    user-select: none;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff;
  }
  /* 背景移到旋转容器 #game-app 上，旋转时背景跟着转，不会竖着 */
  #game-app {
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, rgba(0,0,0,0) 2px 7px),
      radial-gradient(1200px 620px at 50% 18%, rgba(60,140,104,.35), rgba(60,140,104,0) 62%),
      linear-gradient(180deg, #1a5c42 0%, #14503a 45%, #0c382a 100%);
  }

  /* ============================================================
     核心内容层：.scale-layer（1280×720 设计分辨率，由 landscape.js?v=20260908a 缩放居中）
     内部元素全部用 absolute 定位，按设计分辨率坐标摆放。
     ============================================================ */
  .scale-layer { overflow: hidden; }

  /* ===== 顶部条 ===== */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0));
    z-index: 5;
  }
  header h1 {
    font-size: 19px; margin: 0; letter-spacing: 3px; font-weight: 900;
    background: linear-gradient(180deg, #fff4c2, #f3cf5e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 3px rgba(0,0,0,.5);
  }
  header .status { font-size: 13px; opacity: .95; display: flex; align-items: center; }
  #status-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#e74c3c; margin-right:6px; box-shadow: 0 0 6px currentColor; }
  #status-dot.on { background:#2ecc71; }

  /* ===== 牌桌主体（四方对坐 Grid） ===== */
  #table {
    position: absolute;
    top: 48px; left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
    grid-template-rows: 1fr 1.15fr 1.7fr;
    grid-template-columns: 1fr 1.35fr 1fr;
    gap: 6px;
    padding: 6px 10px 8px;
  }
  .seat {
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.16));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 2px 8px rgba(0,0,0,.25);
    padding: 8px 10px;
    overflow: hidden;
    position: relative;
  }
  .seat .name { font-size: 14px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,.8); margin-bottom: 4px; }
  .seat .badge { font-size: 12px; font-weight: normal; opacity: .85; }
  .seat.top    { grid-area: top; }
  .seat.left   { grid-area: left; }
  .seat.right  { grid-area: right; }
  .seat.bottom { grid-area: bottom; }
  .seat.me {
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.14));
    box-shadow: inset 0 0 0 2px rgba(247,215,116,.5), 0 2px 10px rgba(0,0,0,.3);
  }

  /* ===== 中心：罗盘 + 弃牌方阵 ===== */
  #center {
    grid-area: center;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  .compass {
    width: 172px; height: 172px;
    position: relative;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #2f7a52 0%, #17523a 55%, #0b3324 100%);
    border: 3px solid rgba(247,215,116,.85);
    box-shadow: 0 10px 28px rgba(0,0,0,.55), inset 0 3px 10px rgba(255,255,255,.16), inset 0 -6px 14px rgba(0,0,0,.45);
  }
  .compass::after {
    content: ""; position: absolute; inset: 28px; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #1f6a4a, #0c3526 75%);
    border: 2px solid rgba(247,215,116,.6);
    box-shadow: inset 0 3px 8px rgba(0,0,0,.55);
  }
  .compass .wind {
    position: absolute; z-index: 2;
    font-size: 20px; font-weight: 900; color: #ffe9a8;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 3px rgba(0,0,0,.7);
  }
  .wind.w-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .wind.w-s { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .wind.w-e { right: 10px; top: 50%; transform: translateY(-50%); }
  .wind.w-w { left: 10px; top: 50%; transform: translateY(-50%); }
  .compass-center {
    position: absolute; z-index: 3; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #timer {
    font-size: 44px; font-weight: 900; font-variant-numeric: tabular-nums;
    color: #fff; text-shadow: 0 0 12px rgba(255,230,120,.8), 0 2px 4px rgba(0,0,0,.8);
  }
  #timer:empty::before { content: "·"; opacity: .4; }
  .round-num {
    margin-top: 2px; font-size: 13px; font-weight: bold;
    color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .discard-zone {
    position: absolute;
    display: flex; gap: 2px;
    pointer-events: none;
  }
  #discard-WEST  { top: 2px; left: 50%; transform: translateX(-50%); flex-wrap: wrap; justify-content: center; max-width: 100%; }
  #discard-EAST  { bottom: 2px; left: 50%; transform: translateX(-50%); flex-wrap: wrap; justify-content: center; max-width: 100%; }
  #discard-NORTH { left: 2px; top: 50%; transform: translateY(-50%); flex-direction: column; flex-wrap: wrap; max-height: 100%; }
  #discard-SOUTH { right: 2px; top: 50%; transform: translateY(-50%); flex-direction: column; flex-wrap: wrap; max-height: 100%; }

  /* ===== 提示条（scale-layer 内 absolute） ===== */
  #prompt {
    position: absolute;
    left: 50%; top: 56px;
    transform: translateX(-50%);
    z-index: 6;
    background: linear-gradient(180deg, rgba(20,52,40,.92), rgba(10,32,24,.92));
    border: 1px solid rgba(247,215,116,.6);
    border-radius: 10px;
    padding: 6px 16px;
    font-size: 14px; font-weight: bold; text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
    max-width: 70%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ===== 牌张 ===== */
  .tiles { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tile {
    display: inline-flex;
    width: var(--tile-w);
    height: var(--tile-h);
    flex: 0 0 auto;
    position: relative;
    cursor: default;
  }
  .tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 6px;
    background: #fffdf4;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.75),
      0 3px 0 #8a6a24,
      0 4px 0 #6a4f18,
      0 7px 12px rgba(0,0,0,.55);
  }
  .tile.small { width: var(--tile-w-s); height: var(--tile-h-s); }
  .tile.small img { border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 #7a5a1e, 0 4px 7px rgba(0,0,0,.5); }
  .tile.clickable { cursor: pointer; transition: transform .14s cubic-bezier(.3,1.4,.6,1); }
  .tile.clickable:hover { transform: translateY(-15px); }
  .tile.clickable:hover img {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 3px 0 #8a6a24, 0 0 0 2px var(--gold), 0 12px 18px rgba(0,0,0,.6);
  }
  .tile.banned { opacity: .35; filter: grayscale(.8); cursor: not-allowed; }
  .drawn-sep { width: 12px; flex: 0 0 auto; }
  .tile.drawn img { box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 0 0 2px #ffe066, 0 3px 0 #8a6a24; }
  /* 出牌堆里最新出的牌高亮，直到下一张出现 */
  .tile.hot img {
    box-shadow: 0 0 0 3px #ffe066, 0 0 14px rgba(255,224,102,.85), 0 4px 12px rgba(0,0,0,.5);
  }
  .meld {
    display: inline-flex; align-items: center; gap: 2px;
    margin-right: 6px; padding: 2px 4px;
    background: rgba(0,0,0,.25); border-radius: 6px; font-size: 12px;
  }
  .meld .tag { margin-right: 3px; opacity: .95; font-weight: bold; color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  /* 被吃/碰/杠的来源牌横放（指示是哪家打出的） */
  .tile.turned { position: relative; }
  .tile.turned img { transform: rotate(90deg); transform-origin: center; }
  .discards { margin-top: 6px; }
  .discards .label { font-size: 11px; opacity: .75; margin-bottom: 2px; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .hidden-count { display: flex; flex-wrap: wrap; gap: 2px; }

  /* ===== 悬浮操作按钮（屏幕右侧偏中下：大字“吃/碰/杠/胡/过”） ===== */
  #actions {
    position: absolute;
    right: 60px; bottom: 170px;
    left: auto;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
    justify-content: flex-start;
    pointer-events: none;
  }
  #actions:empty { display: none; }
  /* 操作按钮左侧：被吃/碰/杠/胡的那张牌（蓝色描边） */
  #actions button .act-tile {
    width: 30px; height: 40px;
    border-radius: 4px;
    background: #fff;
    overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #actions button .act-tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 0 0 3px #4ba6e8;
  }
  #actions button {
    pointer-events: auto;
    position: relative;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 26px;
    font-size: 27px; font-weight: 900; line-height: 1;
    color: #ffe34d;
    cursor: pointer;
    background: linear-gradient(180deg, rgba(80,150,220,.55), rgba(40,90,160,.55));
    backdrop-filter: blur(6px);
    border: 3px solid #ffe9a8;
    border-radius: 16px;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
      -1px 0 0 #000, 1px 0 0 #000, 0 -1px 0 #000, 0 1px 0 #000,
      0 3px 4px rgba(0,0,0,.7);
    box-shadow:
      0 7px 0 rgba(10,30,60,.7),
      0 12px 20px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.4),
      inset 0 -3px 0 rgba(0,0,0,.25);
    transition: transform .08s, box-shadow .08s, filter .12s;
  }
  #actions button:hover { filter: brightness(1.1); }
  #actions button:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 rgba(10,30,60,.7), 0 5px 10px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.4);
  }
  #actions button.hu   { background: linear-gradient(180deg, #f15a48 0%, #c93025 50%, #9b1c14 100%); box-shadow: 0 7px 0 #6b1410, 0 12px 20px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4); }
  #actions button.pass { background: linear-gradient(180deg, rgba(120,140,160,.55), rgba(70,86,105,.55)); box-shadow: 0 7px 0 rgba(20,30,42,.7), 0 12px 20px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.3); }
  .btn-preview {
    display: inline-flex; gap: 2px; align-items: center;
    background: rgba(0,0,0,.30);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    padding: 3px 5px;
  }
  .btn-preview img { width: 22px; height: 29px; object-fit: cover; border-radius: 3px; display: block; background: #fffdf4; }

  /* ===== 金币（scale-layer 内 absolute 左下角） ===== */
  .coins {
    position: absolute;
    left: 14px; bottom: 12px;
    z-index: 60;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 9px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(20,52,40,.92), rgba(10,32,24,.92));
    border: 1px solid rgba(247,215,116,.6);
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .coin-icon {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff2b0, #f2c14e 55%, #c98a1b 100%);
    border: 2px solid #a86f12;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
    position: relative;
  }
  .coin-icon::after { content: "¥"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #8a5c0a; }
  .coin-num { font-size: 17px; font-weight: 900; color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }

  /* ===== 日志（隐藏） ===== */
  #log { display: none; }

  /* ============================================================
     缩放层外：边缘锚定（设置/菜单/战绩），不随 scale 缩放
     ============================================================ */
  .side-rail {
    position: fixed;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    z-index: 70;
    display: flex; flex-direction: column; gap: 8px;
    padding: 6px 4px;
    background: rgba(0,0,0,.32);
    border: 1px solid rgba(212,175,55,.4);
    border-radius: 24px;
  }
  .rail-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(212,175,55,.5);
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.3));
    color: #f5e6c8; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
    transition: transform .12s, filter .12s;
    animation: railPulse 2.4s ease-in-out infinite;
  }
  .rail-btn:hover { filter: brightness(1.2); transform: scale(1.1); }
  .rail-btn:active { transform: scale(.88); }
  @keyframes railPulse {
    0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,.4), 0 0 0 rgba(247,215,116,0); }
    50% { box-shadow: 0 2px 6px rgba(0,0,0,.4), 0 0 16px rgba(247,215,116,.55); }
  }

  .settings-menu {
    position: fixed;
    right: 58px; top: 50%;
    transform: translateY(-50%);
    z-index: 1000;
    display: none;
    flex-direction: column; gap: 6px;
    background: linear-gradient(180deg, rgba(20,52,40,.96), rgba(10,32,24,.96));
    border: 1px solid rgba(247,215,116,.6);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,.5);
    min-width: 150px;
  }
  .settings-menu.open { display: flex; }
  .menu-item {
    padding: 10px 14px; border-radius: 7px;
    font-size: 14px; font-weight: bold;
    color: #f5e6c8; cursor: pointer; text-align: center;
    background: rgba(255,255,255,.06);
    transition: background .15s;
  }
  .menu-item:hover { background: rgba(247,215,116,.22); }
  .menu-item.danger { color: #ffb0a0; }

  /* ===== 局内聊天 ===== */
  .chat-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(247,215,116,.65);
    background: linear-gradient(180deg, #4fc3f7, #1e88c7);
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
    animation: railPulse 2.4s ease-in-out infinite;
  }
  .chat-btn:hover { filter: brightness(1.15); transform: scale(1.06); }
  .chat-panel {
    position: fixed; right: 58px; top: 50%; transform: translateY(-50%);
    z-index: 1200; display: none;
    flex-direction: column; gap: 10px;
    width: min(320px, 86vw); max-height: 80vh;
    background: linear-gradient(180deg, rgba(20,52,40,.985), rgba(10,32,24,.985));
    border: 1px solid rgba(247,215,116,.65); border-radius: 12px;
    padding: 12px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  .chat-panel.open { display: flex; }
  .chat-title { font-size: 14px; font-weight: 900; color: #f0d27a; letter-spacing: 1px; }
  .chat-phrases { display: flex; flex-wrap: wrap; gap: 6px; }
  .chat-phrase {
    padding: 7px 9px; border: none; border-radius: 8px;
    font-size: 12px; color: #fff; background: rgba(255,255,255,.08);
    cursor: pointer; text-align: left; line-height: 1.35;
  }
  .chat-phrase:active { background: rgba(247,215,116,.32); }
  .chat-emoji { display: flex; flex-wrap: wrap; gap: 8px; }
  .chat-emoji button { font-size: 22px; background: none; border: none; cursor: pointer; padding: 2px; }
  .chat-input-row { display: flex; gap: 6px; }
  .chat-input-row input {
    flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; color: #fff; background: rgba(0,0,0,.35); outline: none;
  }
  .chat-send {
    border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; font-weight: 900;
    color: #fff; background: linear-gradient(180deg, #46d17e, #1b7d45); cursor: pointer;
  }
  .seat { position: relative; }
  .seat-chat {
    position: absolute; left: 50%; top: 44px; transform: translateX(-50%);
    max-width: 90%; background: rgba(0,0,0,.76);
    border: 1px solid rgba(247,215,116,.65); border-radius: 12px;
    padding: 7px 14px; font-size: 22px; color: #ffe9a8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    z-index: 45; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .seat-chat.mine { border-color: rgba(79,195,247,.8); color: #dff4ff; }


  /* ===== 局内战绩面板（卡片式，fixed 弹窗） ===== */
  .records-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    display: none;
  }
  .records-overlay.open { display: block; }
  .records-dialog {
    position: absolute;
    top: 50%; left: 50%;
    /* 矮宽横向大矩形：宽≈横屏宽 94%、高≈横屏高 82%。
       用百分比（相对旋转后的 overlay 容器）实现，比 vw/vh 更稳健：
       vw/vh 是物理视口单位，在 CSS 旋转下不跟着转，会反转成窄高。 */
    width: 94%;
    height: 82%;
    transform: translate(-50%, -50%) scale(.6);
    display: flex; flex-direction: column;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg, #1a4636 0%, #12382b 55%, #0c2f23 100%);
    border: 1px solid rgba(247,215,116,.75);
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(247,215,116,.2), 0 0 20px rgba(247,215,116,.35), 0 24px 60px rgba(0,0,0,.6);
    overflow: hidden;
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  }
  .records-overlay.open .records-dialog {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  .records-head {
    flex: 0 0 auto;
    padding: 12px 20px 13px;
    border-bottom: 1px solid rgba(247,215,116,.35);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  }
  .records-overview {
    flex: 1; min-width: 0;
    display: flex; flex-wrap: wrap; align-items: center;
    column-gap: 18px; row-gap: 10px;
  }
  .records-overview .ov-title { flex: 0 0 auto; font-size: 15px; font-weight: 900; margin: 0; white-space: nowrap; }
  .records-close {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 24px; color: #fff; background: rgba(0,0,0,.35);
  }
  .records-close:hover { background: rgba(0,0,0,.55); }
  .records-body {
    flex: 1; overflow-y: auto; padding: 12px 22px;
    scrollbar-width: thin;
    scrollbar-color: rgba(247,215,116,.5) rgba(0,0,0,.2);
  }
  .records-body::-webkit-scrollbar { width: 8px; }
  .records-body::-webkit-scrollbar-track { background: rgba(0,0,0,.2); border-radius: 4px; }
  .records-body::-webkit-scrollbar-thumb { background: rgba(247,215,116,.45); border-radius: 4px; }
  .records-body::-webkit-scrollbar-thumb:hover { background: rgba(247,215,116,.65); }
  .ov-hero { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .ov-me { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  .ov-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(180deg, #f0d27a, #c9a227 60%, #8a6a1e);
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #3a2a06;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  .ov-total { font-size: 30px; font-weight: 900; color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .ov-stats { display: flex; gap: 8px; }
  .ov-stat { background: rgba(0,0,0,.25); border-radius: 9px; padding: 7px 11px; font-size: 12px; }
  .ov-stat b { color: var(--gold); font-size: 16px; margin-right: 3px; }
  .ov-players {
    flex: 0 0 100%;

  .records-player {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);

  .records-player.me { border-color: rgba(247,215,116,.75); color: var(--gold); background: rgba(247,215,116,.08); }

  .round-list { display: flex; flex-direction: column; gap: 10px; }
  .round-card {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.05);

  .rc-num { flex: 0 0 40px; font-weight: 900; color: var(--gold); font-size: 15px; }
  .rc-badge { flex: 0 0 auto; padding: 3px 12px; border-radius: 20px; font-size: 13px; font-weight: 900; }
  .rc-badge.hu  { background: linear-gradient(180deg, #f15a48, #c93025); color: #fff; }
  .rc-badge.pao { background: linear-gradient(180deg, #f2a33c, #d97a14); color: #fff; }
  .rc-badge.liu { background: rgba(127,140,141,.3); color: #c2ccd0; }
  .rc-winner { flex: 0 0 auto; font-size: 14px; opacity: .9; }
  .rc-hand { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
  .rc-tiles { display: inline-flex; gap: 2px; flex-wrap: nowrap; align-items: center; }
  .rc-tile { width: 22px; height: 30px; object-fit: cover; border-radius: 3px; vertical-align: middle; }
  .rc-meld { display: inline-flex; align-items: center; gap: 1px; margin-left: 4px; font-size: 10px; color: #e8d5a0; }
  .rc-fan { flex: 0 0 auto; font-size: 12px; color: #e8d5a0; }
  .rc-score { flex: 0 0 auto; font-size: 19px; font-weight: 900; }
  .rc-score.win { color: #7fe0a6; }
  .rc-score.lose { color: #ff6b5e; }
  .rc-score.zero { color: #c2ccd0; }
  .rc-win-tile { display: inline-flex; align-items: center; }
  .rc-win-tile .rc-tile { box-shadow: 0 0 0 2px rgba(247,215,116,.9); border-radius: 4px; }

  /* ===== 多人局结束弹层 ===== */
  .multi-end {
    position: absolute; inset: 0; z-index: 3000;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.62);
    backdrop-filter: blur(5px);
    padding: 20px;
  }
  .multi-end.open { display: flex; }
  .multi-end .box {
    width: min(480px, 94%);
    max-height: 86%;
    overflow-y: auto;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg, #1a4636 0%, #12382b 55%, #0c2f23 100%);
    border: 1px solid rgba(247,215,116,.75);
    border-radius: 18px;
    padding: 20px 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
  }
  .multi-end h2 { margin: 0 0 12px; color: var(--gold); letter-spacing: 1px; }
  .multi-end .rank { margin: 5px 0; font-size: 17px; }
  .multi-end .wait { margin-top: 12px; font-size: 14px; opacity: .85; }
  .multi-end .reason { margin-top: 10px; font-size: 13px; opacity: .7; }
  .multi-end .btns { margin-top: 16px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .multi-end button {
    padding: 11px 22px; font-size: 16px; font-weight: 900;
    border: none; border-radius: 12px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #46d17e, #1b7d45);
    box-shadow: 0 4px 0 #145c32;
  }
  .multi-end button.gray { background: linear-gradient(180deg, #6a7680, #4a535c); box-shadow: 0 4px 0 #2e353b; }

  /* ===== 轮到出牌高亮（昵称放大红色，所有端可见） ===== */
  .seat.hl-turn {
    box-shadow: inset 0 0 0 3px rgba(255,95,80,.95), 0 2px 14px rgba(255,80,60,.45);
  }
  /* ===== 胡牌大字（红楷金描边） ===== */
  .hu-banner {
    position: absolute; inset: 0; z-index: 4000;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s;
  }
  .hu-banner.show { opacity: 1; }
  .hu-banner span {
    font-family: "KaiTi", "STKaiti", "楷体", "楷体_GB2312", serif;
    font-size: min(28vw, 120px);
    font-weight: 900;
    color: #ff2f2f;
    letter-spacing: 8px;
    text-shadow:
      0 0 2px #ffd54f,
      0 0 6px #ffd54f,
      0 0 12px rgba(255,213,79,.55),
      0 2px 0 #b8860b,
      0 6px 14px rgba(0,0,0,.55);
  }
  /* 按胡的那家方位贴边显示 */
  .hu-banner.po-top   { align-items: flex-start; padding-top: 9vh; }
  .hu-banner.po-left  { justify-content: flex-start; padding-left: 9vw; }
  .hu-banner.po-right { justify-content: flex-end; padding-right: 9vw; }
  .hu-banner.po-me    { align-items: center; justify-content: center; } /* 自己胡：居中大提示 */

  /* ===== 风位/庄家小角标（海南：位置风按“庄=东 下家=南…”随局变） ===== */
  .wind-chip, .dealer-badge {
    display: inline-block; margin: 0 3px; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; vertical-align: middle; line-height: 1.5;
  }
  .wind-chip {
    color: #f0d27a; background: rgba(0,0,0,.35);
    border: 1px solid rgba(247,215,116,.55);
  }
  .dealer-badge {
    color: #fff; font-weight: 900;
    background: linear-gradient(180deg, #ffb03a, #d97a14);
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }

</style>
</head>
<body>

<div id="game-app">

<div class="hu-banner" id="hu-banner"></div>

</div><!-- /#game-app -->

<script>
"use strict";

// ===== 牌名（日志/提示文字）=====
const ZI = ['东','南','西','北','中','发','白'];
const HUA = ['春','夏','秋','冬','梅','兰','竹','菊'];
function cardName(i){
  if (i < 9)  return (i+1) + '万';
  if (i < 18) return (i-8) + '筒';
  if (i < 27) return (i-17) + '条';
  if (i < 34) return ZI[i-27];
  return HUA[i-34];
}
const MELD_NAME = {CHI:'吃', PENG:'碰', GANG:'杠', AN_GANG:'暗杠', BU_GANG:'补杠'};
const ACTION_NAME = {HU:'胡', GANG:'杠', PENG:'碰', CHI:'吃', AN_GANG:'暗杠', BU_GANG:'补杠', PASS:'过'};
const NICK = {
  EAST: localStorage.getItem('nickname') || localStorage.getItem('username') || '你',
  SOUTH: '电脑·南',
  WEST: '电脑·西',
  NORTH: '电脑·北'
};

// ===== 多人模式（/game）：把服务端的座位名映射到「本地坐标」=====
// 本地固定：EAST=自己(底部), 右边=下家, 上=对家, 左=上家；单人(IS_MULTI=false)时映射恒等。
const QP = new URLSearchParams(location.search);
const IS_MULTI = QP.get('mode') === 'multi';
const SEAT_ORD = ['EAST','SOUTH','WEST','NORTH'];
let seatShift = 0;      // 服务端座位在 SEAT_ORD 中的下标 - 自己的下标
let myServerSeat = 'EAST';

function serverToLocal(s){
  const i = SEAT_ORD.indexOf(s);
  if (i < 0) return s;
  return SEAT_ORD[(i - seatShift + 4) % 4];
}
function mapSeatKeys(o){
  const r = {};
  if (!o) return r;
  for (const k in o) r[serverToLocal(k)] = o[k];
  return r;
}
function translateMeld(m){
  if (!m || !m.from) return m;
  m = Object.assign({}, m);
  m.from = serverToLocal(m.from);
  return m;
}
function translateMsg(msg){
  const out = Object.assign({}, msg);
  if (out.seat != null) out.seat = serverToLocal(out.seat);
  if (out.dealer != null) out.dealer = serverToLocal(out.dealer);
  if (out.from != null) out.from = serverToLocal(out.from);
  if (out.coins) out.coins = mapSeatKeys(out.coins);
  if (out.counts) out.counts = mapSeatKeys(out.counts);
  if (out.discards) out.discards = mapSeatKeys(out.discards);
  if (out.type === 'board' && out.melds) {
    out.melds = mapSeatKeys(out.melds);
    for (const k in out.melds) out.melds[k] = out.melds[k].map(translateMeld);
  } else if (Array.isArray(out.melds)) {
    out.melds = out.melds.map(translateMeld);   // hand：自己的副露数组
  }
  if (out.meld) out.meld = translateMeld(out.meld);
  if (out.type === 'board' && out.flowers) out.flowers = mapSeatKeys(out.flowers);
  return out;
}
function initMulti(msg){
  myServerSeat = msg.seat || myServerSeat;
  const i = SEAT_ORD.indexOf(myServerSeat);
  seatShift = i < 0 ? 0 : i;
  NICK.EAST = localStorage.getItem('nickname') || localStorage.getItem('username') || '你';
  (msg.players || []).forEach(p => {
    NICK[serverToLocal(p.seat)] = p.nickname || ('玩家' + p.userId);
  });
}

// ===== 状态 =====
const state = {
  mySeat: 'EAST',
  handNo: 0, total: -1,
  dealer: null, wind: 0, windName: '', bottom: 1,
  coins: {EAST:0, SOUTH:0, WEST:0, NORTH:0},
  hand: [], melds: [], flowers: [], selfDiscards: [],
  counts: {EAST:0, SOUTH:13, WEST:13, NORTH:13},
  opponents: {
    SOUTH: {discards: [], melds: [], flowers: []},
    WEST:  {discards: [], melds: [], flowers: []},
    NORTH: {discards: [], melds: [], flowers: []},
  },
  pending: null,
  timer: null,
  ended: false,
  drawnTile: -1,
  wall: -1,   // 牌墙剩余
  report: {},  // 座位(本地) -> 报听模式：1 天听 / 2 地听
  chats: {},   // 座位(本地) -> {text, at} 聊天气泡
};

const wsProto = (location.protocol === 'https:') ? 'wss' : 'ws';
let ws;
function connect(){
  if (!IS_MULTI) { location.replace('lobby.html'); return; } // 快速开始已下线，直接打开牌桌页回大厅
  const userId = localStorage.getItem('userId') || '0';
  let url;
  if (IS_MULTI) {
    url = wsProto + '://' + location.host + '/game?userId=' + userId
        + '&code=' + encodeURIComponent(QP.get('code') || '')
        + '&seat=' + encodeURIComponent(QP.get('seat') || 'EAST');
  } else {
    const roomId = localStorage.getItem('roomId') || '';
    url = wsProto + '://' + location.host + '/ws?userId=' + userId + '&roomId=' + roomId;
  }
  ws = new WebSocket(url);
  ws.onopen = () => { setStatus(true, '已连接'); log('已连接，牌局开始'); };
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch(err){ console.error(err); } };
  ws.onclose = (e) => {
    if (e && e.code === 4001) { handleKicked('该账号已在其他设备登录'); return; }
    setStatus(false, '已断开');
    log('连接已断开，刷新页面可重新开始');
  };
  ws.onerror = () => setStatus(false, '连接错误');
}
function setStatus(ok, text){
  document.getElementById('status-dot').className = ok ? 'on' : '';
  document.getElementById('status-text').textContent = text;
}
function send(obj){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// 被同一账号的其他设备登录顶下线：废弃本局并回登录页
function handleKicked(message){
  clearTimer();
  state.ended = true;
  const text = message || '该账号已在其他设备登录，本局已结束';
  localStorage.removeItem('roomId');
  localStorage.removeItem('username');
  localStorage.removeItem('userId');
  localStorage.removeItem('nickname');
  try { if (ws) ws.close(); } catch (e) {}
  alert(text + '，请重新登录');
  location.href = 'index.html';
}

// ===== 消息处理 =====
function handle(raw){
  if (IS_MULTI && raw.type === 'welcome') initMulti(raw);
  const msg = IS_MULTI ? translateMsg(raw) : raw;
  clearTimer();
  switch (msg.type) {
    case 'welcome':
      state.mySeat = msg.seat;
      if (msg.roomId) localStorage.setItem('roomId', msg.roomId);
      break;
    case 'match':
      state.total = (msg.total != null && msg.total > 0) ? msg.total : -1;
      break;
    case 'hand_start':
      hideMultiEnd();
      state.handNo = msg.hand;
      state.total = (msg.total != null && msg.total > 0) ? msg.total : -1;
      state.coins = msg.coins || state.coins;
      if (msg.dealer != null) state.dealer = msg.dealer;
      if (msg.wind != null) state.wind = msg.wind;
      if (msg.windName) state.windName = msg.windName;
      if (msg.bottom != null) state.bottom = msg.bottom;
      resetHand();
      setPrompt((state.windName || '') + '令 · 第 ' + msg.hand + ' 把开始（底分 ' + state.bottom + '）');
      break;
    case 'coins':
      state.coins = msg.coins || state.coins;
      renderCoins();
      break;
    case 'match_end':
      localStorage.removeItem('roomId');
      state.ended = true;
      state.coins = msg.coins || state.coins;
      renderCoins();
      showFinalRanking(msg.coins);
      break;
    case 'kicked':
      handleKicked(msg.message);
      break;
    case 'match_finish':
      onMatchFinish(msg);
      break;
    case 'room_closed':
      alert(msg.reason || '房间已解散');
      location.href = 'lobby.html';
      break;
    case 'dealer':
      log('庄家：' + NICK[msg.dealer]);
      break;
    case 'hand':
      state.hand = msg.hand.slice();
      state.melds = msg.melds;
      state.flowers = msg.flowers;
      render();
      break;
    case 'counts':
      state.counts = msg.counts;
      if (msg.wall != null) { state.wall = msg.wall; updateHandIndicator(); }
      renderOpponents();
      break;
    case 'turn':
      // 当前轮到谁：出牌时高亮该家昵称，所有端一起倒计时
      highlightTurn(msg.kind === 'discard' ? msg.seat : null);
      startTimer(msg.timeoutMs);
      break;
    case 'board':
      for (const seat of ['SOUTH','WEST','NORTH']) {
        state.opponents[seat].discards = (msg.discards && msg.discards[seat]) || [];
        state.opponents[seat].melds = (msg.melds && msg.melds[seat]) || [];
        state.opponents[seat].flowers = (msg.flowers && msg.flowers[seat]) || [];
      }
      if (msg.flowers && msg.flowers[state.mySeat]) state.flowers = msg.flowers[state.mySeat];
      state.selfDiscards = (msg.discards && msg.discards[state.mySeat]) || [];
      discardLog = [];
      render();
      break;
    case 'draw':
      if (msg.seat === state.mySeat) log('你摸到 ' + cardName(msg.tile));
      else log(NICK[msg.seat] + ' 摸牌');
      break;
    case 'flower':
      log(NICK[msg.seat] + ' 摸到花牌 ' + cardName(msg.tile) + '，补牌');
      if (msg.seat === state.mySeat) {
        state.flowers.push(msg.tile);
      } else {
        const o = state.opponents[msg.seat];
        if (o) { if (!o.flowers) o.flowers = []; o.flowers.push(msg.tile); }
      }
      render();
      break;
    case 'chat':
      if (msg.text) showChat(msg.seat, msg.text);
      break;
    case 'discard':
      if (msg.seat === state.mySeat) {
        log('你打出 ' + cardName(msg.tile));
      } else {
        state.opponents[msg.seat].discards.push(msg.tile);
        log(NICK[msg.seat] + ' 打出 ' + cardName(msg.tile));
      }
      discardLog.push(msg.seat);   // 记录谁刚出（全场最新一张）
      if (turnSeat && msg.seat === turnSeat) { highlightTurn(null); clearTimer(); }
      render();
      break;
    case 'meld':
      // 记录被吃/碰/杠的是哪张（=出牌堆里刚被拿走的那张），用于吃牌时标“来源牌”
      if (msg.meld && msg.meld.from) {
        const dls = msg.meld.from === state.mySeat ? state.selfDiscards
          : (state.opponents[msg.meld.from] ? state.opponents[msg.meld.from].discards : null);
        if (dls && dls.length) msg.meld.claimed = dls[dls.length - 1];
      }
      // 被吃/碰/杠的牌从出牌堆里拿走
      removeClaimedDiscard(msg.meld);
      if (msg.meld && msg.meld.from && discardLog.length && discardLog[discardLog.length - 1] === msg.meld.from) {
        discardLog.pop(); // 这张被吃掉/碰掉/杠掉了
      }
      if (msg.seat !== state.mySeat) {
        upsertMeld(state.opponents[msg.seat].melds, msg.meld);
        log(NICK[msg.seat] + ' ' + meldLabel(msg.meld));
      } else {
        upsertMeld(state.melds, msg.meld);   // 自己吃碰杠的副露也展示
        log('你 ' + meldLabel(msg.meld));
      }
      render();
      break;
    case 'report':
      state.report[msg.seat] = msg.mode;
      render();
      break;
    case 'hu':
      log('★ ' + NICK[msg.seat] + ' 胡牌！' + (msg.selfDraw ? '（自摸）' : '（' + NICK[msg.from] + ' 点炮）')
        + ' ' + cardName(msg.tile) + (msg.fans.length ? '  [' + msg.fans.join(',') + ']' : ''), true);
      showHuBanner(msg); // 全员可见，并按胡的那家方位显示
      break;
    case 'end':
      state.ended = true;
      setPrompt('本把结束：' + msg.result);
      render();
      break;
    case 'log':
      log(msg.text);
      break;
    case 'request':
      handleRequest(msg);
      break;
  }
}

function handleRequest(msg){
  chiStep = null;
  state.pending = { kind: msg.kind, reqId: msg.reqId, options: msg.options || [], canReport: !!msg.canReport, ban: msg.ban || [] };
  if (msg.kind === 'discard') {
    state.hand = msg.hand.slice();
    state.drawnTile = (msg.drawnTile != null) ? msg.drawnTile : -1;
    setPrompt('轮到你出牌，点击要打出的牌');
    startTimer(msg.timeoutMs);
  } else if (msg.kind === 'action') {
    state.pending.tile = (msg.tile != null) ? msg.tile : -1;
    setPrompt('有牌可响应：' + cardName(msg.tile));
    startTimer(msg.timeoutMs);
  } else {
    setPrompt('你摸到 ' + cardName(msg.drawnTile) + '，可选择胡/杠或继续出牌');
    startTimer(msg.timeoutMs);
  }
  render();
}

  renderSelf();
  renderOpponents();
  renderActions();
  renderChats();
}

let discardLog = []; // 全场出牌顺序（座位），用于只高亮“最新那张”
let chiStep = null;  // 多种吃法：点“吃”后的选择列表 [{idx,label}]

const WIND_C = ['东','南','西','北'];
function windServerIdx(localSeat){
  const i = SEAT_ORD.indexOf(localSeat);
  return i < 0 ? 0 : (i + seatShift) % 4;
}
function localWind(localSeat){
  if (state.dealer == null) return '';
  const si = windServerIdx(localSeat);
  const ds = windServerIdx(state.dealer);
  return WIND_C[(si - ds + 4) % 4];
}
function seatBadge(localSeat){
  let s = '';
  if (state.dealer != null) s += '<span class="wind-chip">' + localWind(localSeat) + '风</span>';
  if (state.dealer === localSeat) s += '<span class="dealer-badge">庄</span>';
  const rm = state.report[localSeat];
  if (rm) s += '<span class="dealer-badge" style="background:linear-gradient(180deg,#6aa9ff,#2f7fc0)">' + (rm === 1 ? '天听' : '地听') + '</span>';
  return s;
}
function handLabel(){
  const wn = state.windName || (state.wind != null ? WIND_C[state.wind] : '');
  let s = '';
  if (wn) s += wn + '风令';
  if (state.handNo) s += (s ? ' · ' : '') + '第 ' + state.handNo + ' 把';
  if (state.bottom != null) s += ' · 底分 ' + state.bottom;
  if (state.wall >= 0) s += ' · 墙 ' + state.wall;

}

function renderSelf(){
  const el = document.getElementById('seat-EAST');
  const count = state.counts.EAST || 0;
  const melds = state.melds.length ? `<div class="tiles">${state.melds.map(m => meldHtml(m, 'EAST', true)).join('')}</div>` : '';
  const flowers = state.flowers.length
    ? `<div class="discards"><div class="label">花牌</div><div class="tiles">${state.flowers.map(t => tileHtml(t, true)).join('')}</div></div>` : '';

  const clickable = state.pending && state.pending.kind === 'discard' && !state.ended;
  let mainHand = state.hand;
  let drawnTile = -1;
  if (clickable && state.drawnTile >= 0) {
    const idx = mainHand.indexOf(state.drawnTile);
    if (idx >= 0) {
      mainHand = mainHand.slice();
      mainHand.splice(idx, 1);
      drawnTile = state.drawnTile;
    }
  }
  const ban = (state.pending && state.pending.ban) || [];
  const handTiles = mainHand.map(t => {
    const blocked = clickable && ban.indexOf(t) >= 0;
    const cls = 'tile' + (clickable && !blocked ? ' clickable' : '') + (blocked ? ' banned' : '');
    return `<span class="${cls}" data-tile="${t}">${tileImg(t)}</span>`;
  }).join('');
  const drawnHtml = (drawnTile >= 0)
    ? `<span class="drawn-sep"></span><span class="tile clickable drawn" data-tile="${drawnTile}">${tileImg(drawnTile)}</span>`

const ACT_BIG = {HU:'胡', GANG:'杠', AN_GANG:'暗杠', BU_GANG:'补杠', PENG:'碰', CHI:'吃'};

function actOption(idx){
  send({ type: 'act', reqId: state.pending.reqId, index: idx });
  afterDecide();
}
function bindPass(box){
  box.querySelectorAll('button[data-pass]').forEach(b => {

function chiOptionHtml(o){

    ? `<span class="btn-preview">${o.tiles.map(t => `<img src="img/tiles/${t}.png" alt="">`).join('')}</span>` : '';
  const seq = (o.tiles || []).map(cardName).join('');

}
function bindChiChoices(){
  const box = document.getElementById('actions');
  if (!box) return;
  box.querySelectorAll('button[data-chi]').forEach(b => {
    b.addEventListener('click', () => actOption(parseInt(b.dataset.chi)));
  });
  box.querySelectorAll('button[data-back]').forEach(b => {
    b.addEventListener('click', () => { chiStep = null; render(); });
  });
}
function renderActions(){
  const box = document.getElementById('actions');
  if (!box) return;
  if (!state.pending || state.ended) { box.innerHTML = ''; return; }
  if (state.pending.kind === 'discard') {
    // 出牌回合本身不显示吃碰杠；但若可报听，显示“报听”按钮
    box.innerHTML = state.pending.canReport
      ? `<button class="hu" data-baoting="1" style="min-width:150px"><span class="btn-text">报听</span></button>` : '';
    const bt = box.querySelector('[data-baoting]');
    if (bt) {
      bt.addEventListener('click', () => {
        send({ type: 'baoting', reqId: state.pending.reqId });
        clearTimer();
        state.pending = null;
        state.drawnTile = -1;
        setPrompt('已报听，等牌中…');
        render();
      });
    }
    return;
  }

  // 多种吃法：点“吃”之后才弹出具体选择
  if (chiStep && chiStep.length) {
    box.innerHTML = chiStep.map(c =>
      `<button class="chi" data-chi="${c.idx}">${c.html}</button>`).join('')
      + `<button class="pass" data-back="1"><span class="btn-text">‹ 返回</span></button>`;
    bindChiChoices();
    return;
  }

  const options = state.pending.options || [];
  const uniq = [];
  options.forEach((o, idx) => {
    if (o.type !== 'PASS' && !uniq.some(u => u.type === o.type)) {
      uniq.push({ type: o.type, idx: idx });
    }
  });
  let html = '';
  const actTile = (state.pending.kind === 'action' && state.pending.tile >= 0)
    ? `<span class="act-tile"><img src="img/tiles/${state.pending.tile}.png" alt=""></span>` : '';
  uniq.forEach(u => {
    html += `<button class="${btnClass(u.type)}" data-act="${u.idx}" data-type="${u.type}">
      ${actTile}<span class="btn-text">${ACT_BIG[u.type] || u.type}</span></button>`;
  });
  html += `<button class="pass" data-pass="1"><span class="btn-text">过</span></button>`;
  box.innerHTML = html;

  box.querySelectorAll('button[data-act]').forEach(b => {
    b.addEventListener('click', () => {
      const type = b.dataset.type;
      if (type === 'CHI') {
        const chis = [];
        options.forEach((o, i) => { if (o.type === 'CHI') chis.push({ idx: i, o: o }); });
        if (chis.length === 1) { actOption(chis[0].idx); return; }
        chiStep = chis.map(x => ({ idx: x.idx, html: chiOptionHtml(x.o) }));
        render();
        return;
      }
      actOption(parseInt(b.dataset.act));
    });
  });
  bindPass(box);
}

  if (type === 'GANG' || type === 'AN_GANG' || type === 'BU_GANG') return 'gang';

// ===== 工具 =====
function tileImg(t){ return `<img src="img/tiles/${t}.png" alt="${cardName(t)}">`; }
function tileHtml(t, small){
  return `<span class="tile${small ? ' small' : ''}" data-tile="${t}">${tileImg(t)}</span>`;
}
function backTile(small){
  return `<span class="tile back-tile${small ? ' small' : ''}"><img src="img/tile_back.png" alt=""></span>`;
}
function meldHtml(m, ownerLocal, ownerIsMe){
  const type = m.type;
  const tag = MELD_NAME[type] || type;
  const tiles = (m.tiles || []);

  // 暗杠：只有自己(owner)能看到牌面，其他三家看牌背
  if (type === 'AN_GANG') {
    const body = tiles.map(t => ownerIsMe ? `<span class="tile small">${tileImg(t)}</span>` : backTile(true)).join('');
    return `<span class="meld"><span class="tag">${tag}</span>${body}</span>`;
  }

  // 被吃/碰/杠的来源牌横放：上家→最左、下家→最右、对家→中间（吃碰杠一致）
  let turnIdx = -1;
  if (m.from) {
    const ownerIdx = SEAT_ORD.indexOf(ownerLocal);
    const donorIdx = SEAT_ORD.indexOf(m.from);
    if (ownerIdx >= 0 && donorIdx >= 0) {
      const step = (donorIdx - ownerIdx + 4) % 4; // 1=下家 2=对家 3=上家
      if (step === 1) turnIdx = tiles.length - 1;      // 下家 → 最右
      else if (step === 2) turnIdx = Math.floor(tiles.length / 2); // 对家 → 中间
      else turnIdx = 0;                                // 上家 → 最左
    }
  }
  const body = tiles.map((t, i) => {
    const cls = 'tile small' + (i === turnIdx ? ' turned' : '');
    return `<span class="${cls}">${tileImg(t)}</span>`;
  }).join('');
  return `<span class="meld"><span class="tag">${tag}</span>${body}</span>`;
}
function removeClaimedDiscard(m){
  if (!m || !m.from) return;
  const donor = m.from;
  const list = (donor === state.mySeat) ? state.selfDiscards
    : (state.opponents[donor] ? state.opponents[donor].discards : null);
  if (list && list.length) list.pop();
}
// 补杠会把原来的“碰”顶掉；也避免重复的碰/杠叠加
function upsertMeld(list, m){
  const t0 = (m.tiles && m.tiles.length) ? m.tiles[0] : -1;
  for (let i = list.length - 1; i >= 0; i--) {
    const o = list[i];
    const o0 = (o.tiles && o.tiles.length) ? o.tiles[0] : -1;
    if (t0 < 0 || o0 !== t0) continue;
    if (m.type === 'BU_GANG' && o.type === 'PENG') { list.splice(i, 1); continue; }
    if (o.type === m.type && m.type !== 'AN_GANG') list.splice(i, 1);
  }
  list.push(m);
}
function meldLabel(m){ return (MELD_NAME[m.type]||m.type) + (m.tiles||[]).map(cardName).join(''); }

function log(text, highlight){
  const box = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'line' + (highlight ? ' hl' : '');
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function setPrompt(text){
  document.getElementById('prompt-text').textContent = text;
  document.getElementById('timer').textContent = '';
}
function startTimer(ms){
  if (!ms) return;
  let remain = Math.ceil(ms / 1000);
  const el = document.getElementById('timer');
  const tick = () => {
    el.textContent = remain > 0 ? remain : '';
    if (remain <= 0) { clearInterval(state.timer); return; }
    remain--;
  };
  tick();
  state.timer = setInterval(tick, 1000);
}
function clearTimer(){
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  const el = document.getElementById('timer');
  if (el) el.textContent = '';
}

  phraseBox.innerHTML = CHAT_PHRASES.map((p, i) => `<button class="chat-phrase" data-i="${i}">${esc(p)}</button>`).join('');
  phraseBox.querySelectorAll('button').forEach(b => b.addEventListener('click', () => sendChat(CHAT_PHRASES[+b.dataset.i])));
  const emoBox = document.getElementById('chat-emoji');
  emoBox.innerHTML = CHAT_EMOJI.map(e => `<button data-e="${esc(e)}">${e}</button>`).join('');
  emoBox.querySelectorAll('button').forEach(b => b.addEventListener('click', () => sendChat(b.dataset.e)));
  document.getElementById('chat-send').addEventListener('click', sendTypedChat);
  const inp = document.getElementById('chat-input');
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { sendTypedChat(); } });
  const chatBtn = document.getElementById('chat-btn');
  const chatPanel = document.getElementById('chat-panel');
  chatBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    document.getElementById('settings-menu').classList.remove('open');
    chatPanel.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (chatPanel.classList.contains('open') && !chatPanel.contains(e.target) && e.target !== chatBtn) {
      chatPanel.classList.remove('open');
    }
  });
})();

// ===== 局内战绩面板（不离开对局，游戏继续运行） =====
function openRecords(){
  const roomId = localStorage.getItem('roomId') || '';
  const uid = localStorage.getItem('userId') || '0';
  fetch('/api/records/byRoom?roomId=' + encodeURIComponent(roomId) + '&userId=' + uid)
    .then(r => r.json())
    .then(data => {
      renderRecordsDetail(data);
      document.getElementById('records-overlay').classList.add('open');
    })
    .catch(() => alert('加载战绩失败'));
}

function renderRecordsDetail(data){
  const ov = data.overview || {};
  const me = (ov.players || []).find(p => p.isMe) || {};
  const myTotal = me.total || 0;
  const players = (ov.players || []).map(p =>
    `<span class="records-player ${p.isMe ? 'me' : ''}">${p.nickname || '玩家'}：${p.total}</span>`
  ).join('');
  document.getElementById('records-overview').innerHTML = `
    <div class="ov-title">房间 ${data.roomId || ''}</div>
    <div class="ov-hero">
      <div class="ov-me">
        <div class="ov-avatar">雀</div>
        <div class="ov-total">${myTotal >= 0 ? '+' : ''}${myTotal}</div>
      </div>
      <div class="ov-stats">
        <div class="ov-stat">胡牌 <b>${ov.winCount || 0}</b> 次</div>
        <div class="ov-stat">最高番型 <b>${ov.highestFan || '无'}</b></div>
      </div>
    </div>
    <div class="ov-players">${players}</div>`;

  const rounds = data.rounds || [];
  const WIND = ['东','南','西','北'];
  const SEAT = {EAST:'东', SOUTH:'南', WEST:'西', NORTH:'北'};
  const metaOf = (r) => {
    const bits = [];
    bits.push('庄 ' + (SEAT[r.dealerSeat] || '?') + (r.dealerNickname ? '·' + esc(r.dealerNickname) : ''));
    if (r.windIdx != null) bits.push('令 ' + (WIND[r.windIdx] || '?'));
    if (!r.isDraw && r.winType === 1 && r.loser && r.winTile != null) bits.push('点炮 ' + esc(r.loser) + ' 打 ' + cardName(r.winTile));
    return bits.length
      ? '<div style="font-size:11px;color:#cfe0d6;opacity:.85;line-height:1.45;word-break:break-all;flex-wrap:wrap">' + bits.join('　') + '</div>' : '';
  };
  let cards = '';
  rounds.forEach(r => {
    if (r.isDraw) {
      cards += `<div class="round-card" style="display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap"><span class="rc-num">${r.roundNum}</span><div style="flex:1;min-width:150px">${metaOf(r)}<span class="rc-winner">荒庄</span></div></div>`;
      return;
    }
    const ps = r.participants || [];
    const row = (p, kind) => {
      const d = p.detail || {};
      const notes = (d.notes || []).join('、');
      const sc = p.scoreChange || 0;
      const you = p.isMe ? '（我）' : '';
      let tiles = '';
      if (kind === 'hu') {
        tiles += (r.winHand || []).map(tImg).join('');
        tiles += (r.winMelds || []).map(meldHtml2).join('');
      } else {
        tiles += gangHtmlOf(d);
      }
      if (flowerShown(d)) tiles += flowerHtmlOf(d);
      return `<div class="rc-pl ${kind}" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px"><b>${kind === 'hu' ? '胡·' : ''}${esc(p.nickname || '')}${you}</b>`
        + (notes ? ` <span style="color:#e8d5a0">${esc(notes)}</span>` : '')
        + (tiles ? ` <span style="display:inline-flex;flex-wrap:wrap;gap:1px">${tiles}</span>` : '')
        + rcScoreHtml(sc) + `</div>`;
    };
    const lines = [];
    ps.filter(p => p.isWinner).forEach(p => lines.push(row(p, 'hu')));
    ps.filter(p => !p.isWinner
        && (((p.detail || {}).gangs || []).length || ((p.detail || {}).notes || []).length))
      .forEach(p => lines.push(row(p, '')));
    cards += `<div class="round-card" style="display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap">
      <span class="rc-num">${r.roundNum}</span>
      <div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px">${metaOf(r)}${lines.join('')}</div>
    </div>`;
  });
  document.getElementById('records-rounds').innerHTML = `<div class="round-list">${cards}</div>`;
}

function closeRecords(){
  document.getElementById('records-overlay').classList.remove('open');
}
document.getElementById('records-close').addEventListener('click', closeRecords);
document.getElementById('records-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('records-overlay')) closeRecords();
});

connect();
</script>
