<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>海南麻将 · 人机对战</title>
<style>
  :root {
    --gold: #f7d774;
    --gold-deep: #c9a227;
    --tile-w: 52px;
    --tile-h: 68px;
    --tile-w-s: 28px;
    --tile-h-s: 37px;
    --blue-ink: #0b1a3a;
  }
  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    /* 深蓝色丝绸质感背景（纯 CSS 多层渐变模拟绸缎光泽） */
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.022) 0 2px, rgba(0,0,0,0) 2px 7px),
      radial-gradient(1200px 620px at 50% 22%, rgba(64,104,178,.42), rgba(64,104,178,0) 62%),
      radial-gradient(900px 520px at 18% 85%, rgba(30,60,120,.35), rgba(30,60,120,0) 60%),
      radial-gradient(900px 520px at 82% 85%, rgba(30,60,120,.35), rgba(30,60,120,0) 60%),
      linear-gradient(180deg, #10234f 0%, #0d1c40 42%, #0a1633 100%);
  }

  /* ===== 顶部条 ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    flex: 0 0 auto;
    background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0));
    z-index: 5;
  }
  header h1 {
    font-size: 20px; margin: 0; letter-spacing: 3px; font-weight: 900;
    background: linear-gradient(180deg, #fff4c2, #f3cf5e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 3px rgba(0,0,0,.5);
  }
  header .status { font-size: 13px; opacity: .95; display: flex; align-items: center; }
  header .left { display: flex; align-items: center; gap: 14px; }
  header .right { display: flex; align-items: center; gap: 16px; }
  .back { color: #f5e6c8; text-decoration: none; font-size: 15px; font-weight: bold; opacity: .88; }
  .back:hover { opacity: 1; }
  .hand-indicator { font-size: 14px; font-weight: bold; color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #status-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#e74c3c; margin-right:6px; box-shadow: 0 0 6px currentColor; }
  #status-dot.on { background:#2ecc71; }

  /* ===== 牌桌主体 ===== */
  #table {
    flex: 1;
    min-height: 0;
    position: relative;
    display: grid;
    grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
    grid-template-rows: 1fr 1.05fr 1.9fr;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 8px;
    padding: 8px 14px;
  }

  .seat {
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.18));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 2px 8px rgba(0,0,0,.25);
    padding: 8px 10px;
    overflow: hidden;
    position: relative;
  }
  .seat .name { font-size: 14px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,.8); margin-bottom: 4px; }
  .seat .badge { font-size: 12px; font-weight: normal; opacity: .85; }
  .seat.top    { grid-area: top; }
  .seat.left   { grid-area: left; }
  .seat.right  { grid-area: right; }
  .seat.bottom { grid-area: bottom; }
  .seat.me {
    background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.16));
    box-shadow: inset 0 0 0 2px rgba(247,215,116,.5), 0 2px 10px rgba(0,0,0,.3);
  }

  /* ===== 中心（风向盘 + 日志） ===== */
  #center {
    grid-area: center;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 0;
  }

  /* 圆形风向盘 */
  .compass {
    width: 168px; height: 168px;
    flex: 0 0 auto;
    position: relative;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 30%, #3c6ab8 0%, #1c3a72 55%, #0f2148 100%);
    border: 3px solid rgba(247,215,116,.85);
    box-shadow: 0 10px 28px rgba(0,0,0,.55), inset 0 3px 10px rgba(255,255,255,.18), inset 0 -6px 14px rgba(0,0,0,.45);
  }
  .compass::after { /* 中心圆装饰 */
    content: ""; position: absolute; inset: 30px; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #24487f, #0d1c40 75%);
    border: 2px solid rgba(247,215,116,.6);
    box-shadow: inset 0 3px 8px rgba(0,0,0,.55);
  }
  .compass .wind {
    position: absolute; z-index: 2;
    font-size: 22px; font-weight: 900;
    color: #ffe9a8;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 3px rgba(0,0,0,.7);
  }
  .wind.w-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .wind.w-s { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .wind.w-e { right: 10px; top: 50%; transform: translateY(-50%); }
  .wind.w-w { left: 10px; top: 50%; transform: translateY(-50%); }
  .compass-center {
    position: absolute; z-index: 3; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #timer {
    font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums;
    color: #fff; text-shadow: 0 0 12px rgba(255,230,120,.8), 0 2px 4px rgba(0,0,0,.8);
  }
  #timer:empty::before { content: "·"; opacity: .4; }

  /* 日志（中心盘下方，紧凑） */
  #log {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    background: rgba(0,0,0,.32);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    line-height: 1.5;
    min-height: 0;
    max-height: 120px;
    border: 1px solid rgba(255,255,255,.06);
  }
  #log .line.hl { color: var(--gold); font-weight: bold; }

  /* 提示条 */
  #prompt {
    position: fixed;
    left: 50%; top: 58px;
    transform: translateX(-50%);
    z-index: 6;
    background: linear-gradient(180deg, rgba(20,40,90,.92), rgba(10,22,50,.92));
    border: 1px solid rgba(247,215,116,.6);
    border-radius: 10px;
    padding: 6px 16px;
    font-size: 14px; font-weight: bold; text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
    max-width: 80%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ===== 牌张 ===== */
  .tiles { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tile {
    display: inline-flex;
    width: var(--tile-w);
    height: var(--tile-h);
    flex: 0 0 auto;
    position: relative;
    cursor: default;
  }
  .tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 6px;
    background: #fffdf4;
    /* 3D 厚度：顶部高光 + 底部厚边 + 投影 */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.75),
      0 3px 0 #8a6a24,
      0 4px 0 #6a4f18,
      0 7px 12px rgba(0,0,0,.55);
  }
  .tile.small { width: var(--tile-w-s); height: var(--tile-h-s); }
  .tile.small img { border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 #7a5a1e, 0 4px 7px rgba(0,0,0,.5); }
  .tile.clickable { cursor: pointer; transition: transform .13s; }
  .tile.clickable:hover { transform: translateY(-9px); }
  .tile.clickable:hover img {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 3px 0 #8a6a24, 0 0 0 2px var(--gold), 0 12px 18px rgba(0,0,0,.6);
  }

  .meld {
    display: inline-flex; align-items: center; gap: 2px;
    margin-right: 6px; padding: 2px 4px;
    background: rgba(0,0,0,.25); border-radius: 6px; font-size: 12px;
  }
  .meld .tag { margin-right: 3px; opacity: .95; font-weight: bold; color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .discards { margin-top: 6px; }
  .discards .label { font-size: 11px; opacity: .75; margin-bottom: 2px; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .hidden-count { display: flex; flex-wrap: wrap; gap: 2px; }

  /* ===== 悬浮操作按钮（浮在手牌上方） ===== */
  #actions {
    position: fixed;
    left: 50%; bottom: 190px;
    transform: translateX(-50%);
    z-index: 50;
    display: flex; gap: 16px; justify-content: center; flex-wrap: nowrap;
    pointer-events: none;
  }
  #actions:empty { display: none; }
  #actions button {
    pointer-events: auto;
    position: relative;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 10px 24px;
    font-size: 27px; font-weight: 900; line-height: 1;
    color: #ffe34d;
    cursor: pointer;
    background: linear-gradient(180deg, #4d95e8 0%, #2c5fb4 48%, #1b3d8c 100%);
    border: 3px solid #ffe9a8;
    border-radius: 15px;
    /* 黄色艺术字 + 黑色描边 */
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
      -1px 0 0 #000, 1px 0 0 #000, 0 -1px 0 #000, 0 1px 0 #000,
      0 3px 4px rgba(0,0,0,.7);
    /* 3D 立体：底部厚边 + 内高光 + 外投影 */
    box-shadow:
      0 7px 0 #123063,
      0 12px 20px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.45),
      inset 0 -3px 0 rgba(0,0,0,.25);
    transition: transform .08s, box-shadow .08s, filter .12s;
  }
  #actions button:hover { filter: brightness(1.08); }
  #actions button:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 #123063, 0 5px 10px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.4);
  }
  #actions button.hu   { background: linear-gradient(180deg, #e2564b 0%, #b92f27 50%, #8f1d17 100%); box-shadow: 0 7px 0 #6b1410, 0 12px 20px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4); }
  #actions button.pass { background: linear-gradient(180deg, #6b7a8a 0%, #455464 50%, #2c3846 100%); box-shadow: 0 7px 0 #1a222c, 0 12px 20px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.3); }

  /* 嵌套缩略牌面预览（半透明容器） */
  .btn-preview {
    display: inline-flex; gap: 2px; align-items: center;
    background: rgba(0,0,0,.30);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    padding: 3px 5px;
  }
  .btn-preview img { width: 22px; height: 29px; object-fit: cover; border-radius: 3px; display: block; background: #fffdf4; }

  /* ===== 底部金币（左下角） ===== */
  .coins {
    position: fixed;
    left: 18px; bottom: 14px;
    z-index: 60;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 9px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(20,40,90,.92), rgba(10,22,50,.92));
    border: 1px solid rgba(247,215,116,.6);
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .coin-icon {
    width: 26px; height: 26px; border-radius: 50%;
    /* 金币占位符（可用 <img> 替换） */
    background: radial-gradient(circle at 34% 30%, #fff2b0, #f2c14e 55%, #c98a1b 100%);
    border: 2px solid #a86f12;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
    position: relative;
  }
  .coin-icon::after { content: "¥"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #8a5c0a; }
  .coin-num { font-size: 17px; font-weight: 900; color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }

  /* ===== 右侧设置按钮（金属质感边框） ===== */
  .settings-btn {
    position: fixed;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px; color: #e8dcc0;
    display: flex; align-items: center; justify-content: center;
    /* 金属质感边框占位符（可用 <img> 替换齿轮图标） */
    background: linear-gradient(180deg, #3a4a63, #16233a);
    border: 2px solid transparent;
    background-clip: padding-box;
    box-shadow:
      0 0 0 2px #8f9bb0,
      0 0 0 3px #5a6a85,
      inset 0 2px 4px rgba(255,255,255,.35),
      inset 0 -2px 4px rgba(0,0,0,.5),
      0 4px 10px rgba(0,0,0,.5);
    transition: transform .12s, filter .12s;
  }
  .settings-btn:hover { filter: brightness(1.15); }
  .settings-btn:active { transform: translateY(-50%) scale(.94); }

  /* ===== 竖屏/小屏 ===== */
  @media (max-width: 900px) {
    :root { --tile-w: 38px; --tile-h: 50px; --tile-w-s: 20px; --tile-h-s: 26px; }
    .compass { width: 120px; height: 120px; }
    #timer { font-size: 34px; }
    #actions button { font-size: 20px; padding: 8px 16px; }
    header h1 { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <a class="back" href="index.html">‹ 大厅</a>
    <h1>海南麻将</h1>
  </div>
  <div class="right">
    <span id="hand-indicator" class="hand-indicator"></span>
    <div class="status"><span id="status-dot"></span><span id="status-text">连接中…</span></div>
  </div>
</header>

<div id="table">
  <div class="seat top" id="seat-WEST"></div>
  <div class="seat left" id="seat-NORTH"></div>

  <div id="center">
    <!-- 圆形风向盘：东南西北 + 中心倒计时 -->
    <div class="compass">
      <span class="wind w-n">北</span>
      <span class="wind w-e">东</span>
      <span class="wind w-s">南</span>
      <span class="wind w-w">西</span>
      <div class="compass-center"><span id="timer"></span></div>
    </div>
    <div id="log"></div>
  </div>

  <div class="seat right" id="seat-SOUTH"></div>
  <div class="seat bottom me" id="seat-EAST"></div>
</div>

<!-- 提示条 -->
<div id="prompt"><span id="prompt-text">正在发牌…</span></div>

<!-- 悬浮操作按钮（浮在手牌上方） -->
<div id="actions" class="action-dock"></div>

<!-- 左下角金币 -->
<div class="coins"><span class="coin-icon"></span><span class="coin-num" id="coin-num">0</span></div>

<!-- 右侧设置按钮 -->
<button class="settings-btn" title="设置">⚙</button>

<script>
"use strict";

// ===== 牌名（日志/提示文字）=====
const ZI = ['东','南','西','北','中','发','白'];
const HUA = ['春','夏','秋','冬','梅','兰','竹','菊'];
function cardName(i){
  if (i < 9)  return (i+1) + '万';
  if (i < 18) return (i-8) + '筒';
  if (i < 27) return (i-17) + '条';
  if (i < 34) return ZI[i-27];
  return HUA[i-34];
}
const MELD_NAME = {CHI:'吃', PENG:'碰', GANG:'杠', AN_GANG:'暗杠', BU_GANG:'补杠'};
const ACTION_NAME = {HU:'胡', GANG:'杠', PENG:'碰', CHI:'吃', AN_GANG:'暗杠', BU_GANG:'补杠', PASS:'过'};
const SEAT_NAME = {EAST:'东', SOUTH:'南', WEST:'西', NORTH:'北'};

// ===== 状态 =====
const state = {
  mySeat: 'EAST',
  handNo: 0, total: 16,
  coins: {EAST:0, SOUTH:0, WEST:0, NORTH:0},
  hand: [], melds: [], flowers: [], selfDiscards: [],
  counts: {EAST:0, SOUTH:13, WEST:13, NORTH:13},
  opponents: {
    SOUTH: {discards: [], melds: []},
    WEST:  {discards: [], melds: []},
    NORTH: {discards: [], melds: []},
  },
  pending: null,
  timer: null,
  ended: false,
};

const wsProto = (location.protocol === 'https:') ? 'wss' : 'ws';
let ws;
function connect(){
  ws = new WebSocket(wsProto + '://' + location.host + '/ws');
  ws.onopen = () => { setStatus(true, '已连接'); log('已连接，牌局开始'); };
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch(err){ console.error(err); } };
  ws.onclose = () => { setStatus(false, '已断开'); log('连接已断开，刷新页面可重新开始'); };
  ws.onerror = () => setStatus(false, '连接错误');
}
function setStatus(ok, text){
  document.getElementById('status-dot').className = ok ? 'on' : '';
  document.getElementById('status-text').textContent = text;
}
function send(obj){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ===== 消息处理 =====
function handle(msg){
  clearTimer();
  switch (msg.type) {
    case 'welcome':
      state.mySeat = msg.seat;
      break;
    case 'match':
      state.total = msg.total || 16;
      break;
    case 'hand_start':
      state.handNo = msg.hand;
      state.total = msg.total || state.total;
      state.coins = msg.coins || state.coins;
      resetHand();
      setPrompt('第 ' + msg.hand + ' / ' + state.total + ' 把开始');
      break;
    case 'coins':
      state.coins = msg.coins || state.coins;
      renderCoins();
      break;
    case 'match_end':
      state.ended = true;
      state.coins = msg.coins || state.coins;
      renderCoins();
      showFinalRanking(msg.coins);
      break;
    case 'dealer':
      log('庄家：' + SEAT_NAME[msg.dealer] + '位');
      break;
    case 'hand':
      state.hand = msg.hand.slice();
      state.melds = msg.melds;
      state.flowers = msg.flowers;
      render();
      break;
    case 'counts':
      state.counts = msg.counts;
      renderOpponents();
      break;
    case 'draw':
      if (msg.seat === state.mySeat) log('你摸到 ' + cardName(msg.tile));
      else log(SEAT_NAME[msg.seat] + '家摸牌');
      break;
    case 'flower':
      log((msg.seat === state.mySeat ? '你' : SEAT_NAME[msg.seat] + '家') + '摸到花牌 ' + cardName(msg.tile) + '，补牌');
      break;
    case 'discard':
      if (msg.seat === state.mySeat) {
        state.selfDiscards.push(msg.tile);
        log('你打出 ' + cardName(msg.tile));
      } else {
        state.opponents[msg.seat].discards.push(msg.tile);
        log(SEAT_NAME[msg.seat] + '家打出 ' + cardName(msg.tile));
      }
      render();
      break;
    case 'meld':
      if (msg.seat !== state.mySeat) {
        state.opponents[msg.seat].melds.push(msg.meld);
        log(SEAT_NAME[msg.seat] + '家 ' + meldLabel(msg.meld));
      } else {
        log('你 ' + meldLabel(msg.meld));
      }
      render();
      break;
    case 'hu':
      log('★ ' + SEAT_NAME[msg.seat] + '家胡牌！' + (msg.selfDraw ? '（自摸）' : '（' + SEAT_NAME[msg.from] + '家点炮）')
        + ' ' + cardName(msg.tile) + (msg.fans.length ? '  [' + msg.fans.join(',') + ']' : ''), true);
      break;
    case 'end':
      state.ended = true;
      setPrompt('本把结束：' + msg.result);
      render();
      break;
    case 'log':
      log(msg.text);
      break;
    case 'request':
      handleRequest(msg);
      break;
  }
}

function handleRequest(msg){
  state.pending = { kind: msg.kind, reqId: msg.reqId, options: msg.options || [] };
  if (msg.kind === 'discard') {
    state.hand = msg.hand.slice();
    setPrompt('轮到你出牌，点击要打出的牌');
    startTimer(msg.timeoutMs);
  } else if (msg.kind === 'action') {
    setPrompt('有牌可响应：' + cardName(msg.tile));
    startTimer(msg.timeoutMs);
  } else { // draw
    setPrompt('你摸到 ' + cardName(msg.drawnTile) + '，可选择胡/杠或继续出牌');
    startTimer(msg.timeoutMs);
  }
  render();
}

// ===== 渲染 =====
function render(){
  renderSelf();
  renderOpponents();
  renderActions();
}

function resetHand(){
  state.hand = [];
  state.melds = [];
  state.flowers = [];
  state.selfDiscards = [];
  state.opponents = {
    SOUTH: {discards: [], melds: []},
    WEST:  {discards: [], melds: []},
    NORTH: {discards: [], melds: []},
  };
  state.counts = {EAST:0, SOUTH:13, WEST:13, NORTH:13};
  state.pending = null;
  state.ended = false;
  clearTimer();
  document.getElementById('hand-indicator').textContent = '第 ' + state.handNo + ' / ' + state.total + ' 把';
  render();
}

function renderCoins(){
  document.getElementById('coin-num').textContent = state.coins[state.mySeat] || 0;
  renderOpponents();
}

function showFinalRanking(coins){
  const order = ['EAST','SOUTH','WEST','NORTH'].slice().sort((a,b) => coins[b] - coins[a]);
  log('===== 对局结束（' + state.total + ' 把）=====', true);
  order.forEach((seat, i) => {
    log('第' + (i+1) + '名 ' + SEAT_NAME[seat] + '家：金币 ' + coins[seat]);
  });
  setPrompt('对局结束，刷新页面可再来一场');
}

function renderSelf(){
  const el = document.getElementById('seat-EAST');
  const count = state.counts.EAST || 0;
  const myDiscards = state.selfDiscards.length
    ? `<div class="discards"><div class="label">打出的牌</div><div class="tiles">${state.selfDiscards.map(t => tileHtml(t, true)).join('')}</div></div>` : '';
  const melds = state.melds.length ? `<div class="tiles">${state.melds.map(meldHtml).join('')}</div>` : '';
  const flowers = state.flowers.length
    ? `<div class="discards"><div class="label">花牌</div><div class="tiles">${state.flowers.map(t => tileHtml(t, true)).join('')}</div></div>` : '';

  const clickable = state.pending && state.pending.kind === 'discard' && !state.ended;
  const handTiles = state.hand.map(t => {
    const cls = 'tile' + (clickable ? ' clickable' : '');
    return `<span class="${cls}" data-tile="${t}">${tileImg(t)}</span>`;
  }).join('');

  el.innerHTML = `
    <div class="name">你（东家） <span class="badge">手牌 ${count} 张</span></div>
    ${melds}
    <div class="tiles" id="hand-tiles">${handTiles}</div>
    ${flowers}
    ${myDiscards}`;

  if (clickable) {
    document.querySelectorAll('#hand-tiles .tile.clickable').forEach(el => {
      el.addEventListener('click', () => {
        send({ type: 'discard', reqId: state.pending.reqId, tile: parseInt(el.dataset.tile) });
        clearTimer();
        state.pending = null;
        setPrompt('等待中…');
        render();
      });
    });
  }
}

function renderOpponents(){
  for (const seat of ['SOUTH','WEST','NORTH']) {
    const el = document.getElementById('seat-' + seat);
    const opp = state.opponents[seat];
    const count = state.counts[seat] || 0;
    const coin = state.coins[seat] || 0;
    const hidden = `<div class="hidden-count">${backTile(true).repeat(count)}</div>`;
    const melds = opp.melds.length ? `<div class="tiles">${opp.melds.map(meldHtml).join('')}</div>` : '';
    const discards = opp.discards.length
      ? `<div class="discards"><div class="label">打出的牌</div><div class="tiles">${opp.discards.map(t => tileHtml(t, true)).join('')}</div></div>` : '';
    el.innerHTML = `
      <div class="name">${SEAT_NAME[seat]}家 <span class="badge">${count} 张 · 币 ${coin}</span></div>
      ${hidden}
      ${melds}
      ${discards}`;
  }
}

function renderActions(){
  const box = document.getElementById('actions');
  if (!box) return;
  if (!state.pending || state.ended || state.pending.kind === 'discard') { box.innerHTML = ''; return; }

  const options = state.pending.options || [];
  let html = '';
  options.forEach((opt, idx) => {
    const name = ACTION_NAME[opt.type] || opt.type;
    const preview = (opt.tiles && opt.tiles.length)
      ? `<span class="btn-preview">${opt.tiles.map(t => `<img src="img/tiles/${t}.png" alt="">`).join('')}</span>`
      : '';
    html += `<button class="${btnClass(opt.type)}" data-idx="${idx}"><span class="btn-text">${name}</span>${preview}</button>`;
  });
  html += `<button class="pass" data-pass="1"><span class="btn-text">过</span></button>`;
  box.innerHTML = html;

  box.querySelectorAll('button[data-idx]').forEach(b => {
    b.addEventListener('click', () => {
      send({ type: 'act', reqId: state.pending.reqId, index: parseInt(b.dataset.idx) });
      afterDecide();
    });
  });
  box.querySelectorAll('button[data-pass]').forEach(b => {
    b.addEventListener('click', () => {
      send({ type: 'pass', reqId: state.pending.reqId });
      afterDecide();
    });
  });
}

function btnClass(type){
  if (type === 'HU') return 'hu';
  if (type === 'GANG' || type === 'AN_GANG' || type === 'BU_GANG') return 'gang';
  if (type === 'PENG') return 'peng';
  if (type === 'CHI') return 'chi';
  return 'pass';
}
function afterDecide(){
  clearTimer();
  state.pending = null;
  setPrompt('等待中…');
  render();
}

// ===== 工具 =====
function tileImg(t){ return `<img src="img/tiles/${t}.png" alt="${cardName(t)}">`; }
function tileHtml(t, small){
  return `<span class="tile${small ? ' small' : ''}" data-tile="${t}">${tileImg(t)}</span>`;
}
function backTile(small){
  return `<span class="tile back-tile${small ? ' small' : ''}"><img src="img/tile_back.png" alt=""></span>`;
}
function meldHtml(m){
  const tag = MELD_NAME[m.type] || m.type;
  const tiles = (m.tiles || []).map(t => tileHtml(t, true)).join('');
  return `<span class="meld"><span class="tag">${tag}</span>${tiles}</span>`;
}
function meldLabel(m){ return (MELD_NAME[m.type]||m.type) + (m.tiles||[]).map(cardName).join(''); }

function log(text, highlight){
  const box = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'line' + (highlight ? ' hl' : '');
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function setPrompt(text){
  document.getElementById('prompt-text').textContent = text;
  document.getElementById('timer').textContent = '';
}
function startTimer(ms){
  if (!ms) return;
  let remain = Math.ceil(ms / 1000);
  const el = document.getElementById('timer');
  const tick = () => {
    el.textContent = remain > 0 ? remain : '';
    if (remain <= 0) { clearInterval(state.timer); return; }
    remain--;
  };
  tick();
  state.timer = setInterval(tick, 1000);
}
function clearTimer(){
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  const el = document.getElementById('timer');
  if (el) el.textContent = '';
}

connect();
</script>
