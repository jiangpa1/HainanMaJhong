<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海南麻将 · 登录</title>
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f0d27a;
    --orange: #f2a33c;
    --ink: #f5e6c8;
    --glass: rgba(255,255,255,.08);
    --glass-border: rgba(212,175,55,.55);
  }
  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    /* 隐约可见的深绿色麻将桌布背景 */
    background:
      radial-gradient(1100px 620px at 50% 20%, rgba(52,122,82,.40), rgba(52,122,82,0) 62%),
      radial-gradient(800px 500px at 15% 90%, rgba(30,90,60,.32), rgba(30,90,60,0) 60%),
      radial-gradient(800px 500px at 85% 90%, rgba(30,90,60,.32), rgba(30,90,60,0) 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg, #0f3d2a 0%, #0a2e20 52%, #062018 100%);
  }

  /* ===== 磨砂玻璃容器 ===== */
  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 34px 32px 28px;
    border-radius: 22px;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.12),
      0 24px 60px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.12);
  }
  /* 顶部品牌 */
  .brand {
    text-align: center;
    margin-bottom: 6px;
  }
  .brand .logo {
    font-size: 34px; font-weight: 900; letter-spacing: 6px; text-indent: 6px;
    background: linear-gradient(180deg, #fff6cf, #e8c76a 55%, #b8860b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.5));
  }
  .brand .sub { font-size: 12px; opacity: .6; letter-spacing: 2px; margin-top: 2px; }

  /* ===== 选项卡切换 ===== */
  .tabs {
    position: relative;
    display: flex;
    margin: 22px 0 26px;
    background: rgba(0,0,0,.25);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    padding: 4px;
  }
  .tabs .slider {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px);
    border-radius: 9px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    transition: transform .28s cubic-bezier(.4,1.4,.5,1);
  }
  .tabs[data-active="register"] .slider { transform: translateX(100%); }
  .tab {
    position: relative; z-index: 2;
    flex: 1; text-align: center;
    padding: 10px 0;
    font-size: 15px; font-weight: 900; letter-spacing: 2px;
    cursor: pointer;
    color: rgba(255,255,255,.75);
    transition: color .25s;
  }
  .tab.active { color: #3a2a06; text-shadow: 0 1px 1px rgba(255,255,255,.25); }

  /* ===== 表单 ===== */
  form { display: flex; flex-direction: column; gap: 16px; }
  .field {
    position: relative;
    display: flex; align-items: center;
    background: rgba(0,0,0,.32);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,175,55,.18);
  }
  .field .ic {
    flex: 0 0 auto;
    width: 46px; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.55);
  }
  .field .ic svg { width: 19px; height: 19px; }
  .field input {
    flex: 1;
    min-width: 0;
    background: none; border: none; outline: none;
    padding: 14px 12px 14px 0;
    font-size: 16px; color: #fff;
  }
  .field input::placeholder { color: rgba(255,255,255,.38); }
  /* 密码眼睛切换 */
  .eye {
    flex: 0 0 auto;
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,.55); padding: 0;
  }
  .eye:hover { color: rgba(255,255,255,.9); }
  .eye svg { width: 19px; height: 19px; }
  .eye .eye-off { display: none; }
  .eye.on .eye-on { display: none; }
  .eye.on .eye-off { display: block; }

  /* 注册时的确认密码字段（默认隐藏） */
  #confirm-row { display: none; }

  /* ===== 主按钮（金色/橙渐变 + 收缩动画） ===== */
  .submit {
    margin-top: 6px;
    border: none; border-radius: 12px;
    padding: 15px;
    font-size: 18px; font-weight: 900; letter-spacing: 4px;
    color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ffb03a 0%, #f2981f 52%, #d97a14 100%);
    box-shadow: 0 6px 0 #a35a10, 0 12px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.4);
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s;
  }
  .submit:hover { filter: brightness(1.06); }
  .submit:active {
    transform: scale(.96) translateY(4px);
    box-shadow: 0 2px 0 #a35a10, 0 6px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
  }

  /* ===== 辅助链接 ===== */
  .aux {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px;
    font-size: 13px;
  }
  .aux a { color: rgba(255,255,255,.66); text-decoration: none; cursor: pointer; transition: color .15s; }
  .aux a:hover { color: var(--gold-light); }

  /* toast */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translate(-50%, -14px);
    background: rgba(0,0,0,.74); color: #f7ecd0;
    padding: 10px 22px; border-radius: 10px; font-size: 14px;
    border: 1px solid rgba(212,175,55,.6);
    opacity: 0; transition: opacity .25s, transform .25s; z-index: 1000; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 响应式 ===== */
  @media (max-width: 480px) {
    .card { padding: 26px 20px 22px; }
    .brand .logo { font-size: 28px; }
  }
  /* ===== 适应手机页面 ===== */

</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo">海南麻将</div>
    <div class="sub">HAINAN MAHJONG</div>
  </div>

  <!-- 选项卡 -->
  <div class="tabs" id="tabs" data-active="login">
    <div class="slider"></div>
    <div class="tab active" data-tab="login">登录</div>
    <div class="tab" data-tab="register">注册</div>
  </div>

  <form id="auth-form" autocomplete="off">
    <div class="field">
      <span class="ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <input type="text" id="username" placeholder="用户名" maxlength="16">
    </div>

    <div class="field">
      <span class="ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <input type="password" id="password" placeholder="密码" maxlength="20">
      <button type="button" class="eye" id="eye" title="显示/隐藏密码">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <div class="field" id="confirm-row">
      <span class="ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <input type="password" id="confirm" placeholder="确认密码" maxlength="20">
    </div>

    <button type="submit" class="submit" id="submit-btn" data-landscape>进入游戏</button>
    <label style="display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:#9fd0bd;margin-top:10px;cursor:pointer">
      <input type="checkbox" id="remember" style="accent-color:#46d17e;width:14px;height:14px">记住用户名和密码
    </label>
  </form>

  <div class="aux">
    <a id="forgot-link">忘记密码？</a>
    <a id="guest-link" data-landscape>游客登录</a>
  </div>

  <a href="/download/app" style="display:block;margin-top:16px;text-align:center;color:#9fd0bd;font-size:13px;letter-spacing:1px;text-decoration:none">⬇ 下载安卓 APP</a>
</div>

<script>
"use strict";
const tabs = document.getElementById('tabs');
const tabEls = tabs.querySelectorAll('.tab');
const confirmRow = document.getElementById('confirm-row');
const submitBtn = document.getElementById('submit-btn');
const form = document.getElementById('auth-form');
const user = document.getElementById('username');
const pwd = document.getElementById('password');
const confirmInput = document.getElementById('confirm');
const eye = document.getElementById('eye');
const remember = document.getElementById('remember');

// 记住的用户名/密码自动回填
(function(){
  try {
    const u = localStorage.getItem('remember-user');
    if (u) { user.value = u; }
    const p = localStorage.getItem('remember-pass');
    if (p) { remember.checked = true; pwd.value = p; }
  } catch (e) {}
})();

let mode = 'login';

function setMode(m){
  mode = m;
  tabs.dataset.active = m;
  tabEls.forEach(t => t.classList.toggle('active', t.dataset.tab === m));
  confirmRow.style.display = (m === 'register') ? 'flex' : 'none';
  submitBtn.textContent = (m === 'register') ? '注册并进入' : '进入游戏';
}

tabEls.forEach(t => t.addEventListener('click', () => setMode(t.dataset.tab)));

// 密码显示切换
eye.addEventListener('click', () => {
  const show = pwd.type === 'password';
  pwd.type = show ? 'text' : 'password';
  confirmInput.type = show ? 'text' : 'password';
  eye.classList.toggle('on', show);
});

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 260); }, 1600);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = user.value.trim();
  if (!name) { toast('请输入用户名'); return; }
  if (!pwd.value) { toast('请输入密码'); return; }
  if (mode === 'register') {
    if (pwd.value.length < 6) { toast('密码至少 6 位'); return; }
    if (pwd.value !== confirmInput.value) { toast('两次输入的密码不一致'); return; }
  }
  try {
    const res = await fetch(mode === 'register' ? '/api/register' : '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name, password: pwd.value })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('username', name);
      localStorage.setItem('userId', data.userId || 0);
      localStorage.setItem('nickname', data.nickname || name);
      if (remember.checked) {
        localStorage.setItem('remember-user', name);
        localStorage.setItem('remember-pass', pwd.value);
      } else {
        localStorage.removeItem('remember-user');
        localStorage.removeItem('remember-pass');
      }
      toast(data.message + '，进入游戏');
      setTimeout(() => location.href = 'lobby.html', 500);
    } else {
      toast(data.message || '操作失败');
    }
  } catch (err) {
    toast('网络错误，请稍后重试');
  }
});

document.getElementById('forgot-link').addEventListener('click', () => toast('请联系客服找回密码'));
document.getElementById('guest-link').addEventListener('click', () => {
  localStorage.setItem('username', '游客');
  localStorage.setItem('userId', '0');
  localStorage.setItem('nickname', '游客');
  toast('以游客身份进入');
  setTimeout(() => location.href = 'lobby.html', 400);
});
</script>
</body>
</html>
