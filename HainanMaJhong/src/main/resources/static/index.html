<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>海南麻将 · 大厅</title>
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f0d27a;
    --gold-deep: #a8842a;
    --ink: #f5e6c8;
  }
  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    /* 深绿色中国风背景（多层渐变模拟丝绸纹理） */
    background:
      radial-gradient(1100px 620px at 50% 18%, rgba(52,122,82,.38), rgba(52,122,82,0) 62%),
      radial-gradient(800px 500px at 12% 88%, rgba(30,90,60,.30), rgba(30,90,60,0) 60%),
      radial-gradient(800px 500px at 88% 88%, rgba(30,90,60,.30), rgba(30,90,60,0) 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.016) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg, #0f3d2a 0%, #0a2e20 50%, #062018 100%);
  }
  /* 金色包边画框 */
  body::before {
    content: "";
    position: fixed; inset: 10px;
    border: 2px solid rgba(212,175,55,.40);
    border-radius: 18px;
    pointer-events: none;
    z-index: 999;
    box-shadow: inset 0 0 30px rgba(0,0,0,.35);
  }

  /* ===== 顶部用户信息区（半透明黑窄条） ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 22px;
    background: rgba(0,0,0,.42);
    backdrop-filter: blur(4px);
    border-bottom: 1px solid rgba(212,175,55,.5);
    z-index: 10;
  }
  .user { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    flex: 0 0 auto;
    /* 圆形头像占位符（可替换为 <img>） */
    background: linear-gradient(180deg, #f0d27a, #c9a227 55%, #8a6a1e);
    border: 2px solid var(--gold-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #3a2a06;
    box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.5);
  }
  .nick {
    font-size: 18px; font-weight: bold; letter-spacing: 1px;
    color: #f7ecd0;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }

  /* ===== 核心操作区 ===== */
  .stage {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px;
    padding: 90px 20px 120px;
    position: relative; z-index: 5;
  }
  .logo {
    font-size: 54px; font-weight: 900; letter-spacing: 8px; text-indent: 8px;
    background: linear-gradient(180deg, #fff6cf, #e8c76a 55%, #b8860b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.5));
    margin-bottom: 8px;
  }

  /* 通用按钮：金色包边 + 拟物底部厚边 + 扁平渐变 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 3px solid var(--gold-light);
    border-radius: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    text-decoration: none;
    color: #fff;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover { transform: scale(1.05); filter: brightness(1.07); }
  .btn:active { transform: scale(.96) translateY(5px); }

  /* 快速开始：最大、橙红渐变 + 发光 */
  .btn-quick {
    font-size: 46px;
    padding: 26px 96px;
    background: linear-gradient(180deg, #ff9a3d 0%, #f2572e 52%, #d92b1f 100%);
    box-shadow:
      0 10px 0 #a31f16,
      0 20px 34px rgba(0,0,0,.55),
      0 0 48px rgba(255,120,40,.50);
    text-shadow: 0 2px 4px rgba(0,0,0,.55);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .btn-quick:active { box-shadow: 0 4px 0 #a31f16, 0 10px 16px rgba(0,0,0,.5), 0 0 30px rgba(255,120,40,.4); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 10px 0 #a31f16, 0 20px 34px rgba(0,0,0,.55), 0 0 30px rgba(255,120,40,.35); }
    50%      { box-shadow: 0 10px 0 #a31f16, 0 20px 34px rgba(0,0,0,.55), 0 0 62px rgba(255,140,50,.70); }
  }

  /* 下方两个并排按钮 */
  .btn-row { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; }
  .btn-create, .btn-join {
    font-size: 26px;
    padding: 17px 46px;
    box-shadow: 0 7px 0 rgba(0,0,0,.35), 0 12px 22px rgba(0,0,0,.45);
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .btn-create {
    background: linear-gradient(180deg, #46d17e 0%, #28ab60 55%, #1b7d45 100%);
    box-shadow: 0 7px 0 #145c32, 0 12px 22px rgba(0,0,0,.45);
  }
  .btn-join {
    background: linear-gradient(180deg, #4ba6e8 0%, #2f7fc0 55%, #1f5d94 100%);
    box-shadow: 0 7px 0 #16486f, 0 12px 22px rgba(0,0,0,.45);
  }

  /* ===== 底部功能区（图标按钮） ===== */
  .dock {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 42px;
    z-index: 10;
  }
  .icon-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer;
    color: #f2e5c8; font-size: 14px; font-weight: bold; letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .icon-btn .icon {
    width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px;
    background: linear-gradient(180deg, rgba(240,210,122,.28), rgba(120,90,20,.24));
    border: 2px solid rgba(212,175,55,.75);
    box-shadow: 0 3px 9px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.18);
    transition: transform .15s ease, filter .15s ease;
  }
  .icon-btn:hover .icon { transform: scale(1.12); filter: brightness(1.15); }
  .icon-btn:active .icon { transform: scale(.92); }

  /* 轻提示 toast */
  .toast {
    position: fixed; top: 74px; left: 50%; transform: translate(-50%, -12px);
    background: rgba(0,0,0,.72); color: #f7ecd0;
    padding: 9px 20px; border-radius: 10px; font-size: 14px;
    border: 1px solid rgba(212,175,55,.6);
    opacity: 0; transition: opacity .25s, transform .25s; z-index: 1000; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 响应式 ===== */
  @media (max-width: 640px) {
    .logo { font-size: 38px; letter-spacing: 4px; }
    .btn-quick { font-size: 34px; padding: 20px 60px; }
    .btn-row { gap: 20px; }
    .btn-create, .btn-join { font-size: 21px; padding: 14px 30px; }
  }
</style>
</head>
<body>

<!-- 顶部用户信息区 -->
<header class="top-bar">
  <div class="user">
    <div class="avatar">雀</div>
    <span class="nick">海南雀神</span>
  </div>
</header>

<!-- 核心操作区 -->
<main class="stage">
  <div class="logo">海南麻将</div>
  <a class="btn btn-quick" href="game.html">快速开始</a>
  <div class="btn-row">
    <a class="btn btn-create" href="game.html">创建房间</a>
    <a class="btn btn-join" href="game.html">加入房间</a>
  </div>
</main>

<!-- 底部功能区 -->
<footer class="dock">
  <button class="icon-btn" onclick="toast('设置功能开发中')"><span class="icon">⚙</span>设置</button>
  <button class="icon-btn" onclick="toast('战绩查询开发中')"><span class="icon">🏆</span>战绩查询</button>
</footer>

<script>
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 260); }, 1500);
}
</script>
</body>
</html>
