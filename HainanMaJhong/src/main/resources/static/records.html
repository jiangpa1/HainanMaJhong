<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>海南麻将 · 战绩</title>
<link rel="stylesheet" href="landscape.css?v=20260908c">
<style>
  :root {
    --gold: #f7d774;
    --gold-deep: #c9a227;
    --green: #1a4636;
    --green-dark: #12382b;
    --ink: #f5e6c8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  /* 背景移到旋转容器 #game-app 上 */
  #game-app {
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(52,122,82,.32), rgba(52,122,82,0) 60%),
      linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
    /* 移动端 landscape.js?v=20260908c 会把页面搬进 #game-app，这里恢复 flex 纵向排列，
       否则 #list 的 flex:1 + overflow 没有可滚动的父级 */
    display: flex;
    flex-direction: column;
  }
  #game-app > header { flex: 0 0 auto; }
  #game-app > main { flex: 1 1 auto; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px;
    background: rgba(0,0,0,.30);
    border-bottom: 1px solid rgba(212,175,55,.4);
  }
  header h1 {
    font-size: 22px; margin: 0; letter-spacing: 3px; font-weight: 900;
    background: linear-gradient(180deg, #fff6cf, #e8c76a 55%, #b8860b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }
  .back { color: var(--ink); text-decoration: none; font-size: 15px; font-weight: bold; opacity: .85; }
  .back:hover { opacity: 1; }

  #list {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);   /* 宽屏双列网格 */
    gap: 14px;
    align-content: start;
    scroll-behavior: smooth;
  }
  .empty { text-align: center; margin-top: 80px; opacity: .6; font-size: 15px; }

  .card {
    display: flex; align-items: center; gap: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.18));
    border: 1px solid rgba(212,175,55,.4);
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    transition: transform .15s, filter .15s;
  }
  .card:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .card:active { transform: scale(.97); filter: brightness(1.02); }
  .card .pnl {
    flex: 0 0 110px; text-align: center;
    font-size: 28px; font-weight: 900;
  }
  .pnl.win { color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .pnl.lose { color: #ff6b5e; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .card .mid { flex: 1; min-width: 0; }
  .mid .room { font-size: 15px; font-weight: bold; opacity: .95; margin-bottom: 4px; }
  .mid .meta { font-size: 12px; opacity: .65; }
  .card .rank {
    flex: 0 0 auto;
    font-size: 14px; font-weight: 900;
    padding: 5px 12px; border-radius: 20px;
    background: rgba(0,0,0,.25);
  }
  .rank.r1 { color: var(--gold); border: 1px solid rgba(247,215,116,.6); }
  .rank.r2 { color: #dfe6ee; }
  .rank.r3 { color: #e0a56a; }
  .rank.r4 { color: #b0b8c0; }
  .btn-detail {
    flex: 0 0 auto;
    padding: 10px 16px;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: bold; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #4ba6e8 0%, #2f7fc0 55%, #1f5d94 100%);
    box-shadow: 0 4px 0 #16486f, 0 6px 12px rgba(0,0,0,.4);
    transition: transform .1s, box-shadow .1s;
  }
  .btn-detail:active { transform: translateY(3px); box-shadow: 0 1px 0 #16486f, 0 3px 6px rgba(0,0,0,.4); }

  /* ===== 详情弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    display: none;
  }
  .overlay.open { display: block; }
  .dialog {
    position: absolute;
    top: 50%; left: 50%;
    width: 94%;    /* 矮宽：横屏宽 94%（相对旋转后的 overlay，避免 vw/vh 在横屏旋转下转反） */
    height: 82%;   /* 横屏高 82% */
    transform: translate(-50%, -50%) scale(.6);
    display: flex; flex-direction: column;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg, #1a4636 0%, #12382b 55%, #0c2f23 100%);
    border: 1px solid rgba(247,215,116,.75);
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(247,215,116,.2), 0 0 20px rgba(247,215,116,.35), 0 24px 60px rgba(0,0,0,.6);
    overflow: hidden;
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  }
  .overlay.open .dialog { transform: translate(-50%, -50%) scale(1); opacity: 1; }

  .dialog-head {
    flex: 0 0 auto;
    padding: 12px 20px 13px;
    border-bottom: 1px solid rgba(247,215,116,.35);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  }
  .overview {
    flex: 1; min-width: 0;
    display: flex; flex-wrap: wrap; align-items: center;
    column-gap: 18px; row-gap: 10px;
  }
  .overview .ov-title { flex: 0 0 auto; font-size: 15px; font-weight: 900; margin: 0; white-space: nowrap; }
  .player-tag {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 9px; padding: 5px 12px; font-size: 13px;
    font-weight: bold; white-space: nowrap;
  }
  .player-tag.me { border-color: rgba(247,215,116,.75); color: var(--gold); background: rgba(247,215,116,.08); }
  .close {
    flex: 0 0 auto;
    width: 46px; height: 46px; border-radius: 50%;
    border: none; cursor: pointer;
    font-size: 24px; color: #fff;
    background: rgba(0,0,0,.35);
  }
  .close:hover { background: rgba(0,0,0,.55); }

  .dialog-body {
    flex: 1; overflow-y: auto; padding: 14px 22px;
    scrollbar-width: thin;
    scrollbar-color: rgba(247,215,116,.5) rgba(0,0,0,.2);
  }
  .dialog-body::-webkit-scrollbar { width: 8px; }
  .dialog-body::-webkit-scrollbar-track { background: rgba(0,0,0,.2); border-radius: 4px; }
  .dialog-body::-webkit-scrollbar-thumb { background: rgba(247,215,116,.45); border-radius: 4px; }
  .dialog-body::-webkit-scrollbar-thumb:hover { background: rgba(247,215,116,.65); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.06); }
  th { color: var(--gold); font-weight: bold; opacity: .9; position: sticky; top: 0; background: rgba(18,56,43,.96); }
  .badge { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
  .badge.zimo { background: rgba(46,204,113,.18); color: #7fe0a6; }
  .badge.dianpao { background: rgba(243,156,18,.18); color: #f3c56a; }
  .badge.liuju { background: rgba(127,140,141,.18); color: #c2ccd0; }
  .tile-mini { width: 26px; height: 34px; object-fit: cover; border-radius: 3px; vertical-align: middle; }
  .meld-sep { opacity: .5; margin: 0 4px; }
  .meld-group { display: inline-flex; align-items: center; gap: 1px; margin-left: 6px; font-size: 11px; color: #e8d5a0; }
  .fan-list { color: #e8d5a0; }
  .sc.up { color: #7fe0a6; font-weight: 900; }
  .sc.down { color: #ff6b5e; font-weight: 900; }

  /* ===== 头部两行式：与游戏内战绩面板保持一致 ===== */
  .ov-hero { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .ov-me { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  .ov-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(180deg, #f0d27a, #c9a227 60%, #8a6a1e);
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #3a2a06;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  .ov-total { font-size: 30px; font-weight: 900; color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .ov-stats { display: flex; gap: 8px; }
  .ov-stat { background: rgba(0,0,0,.25); border-radius: 9px; padding: 7px 11px; font-size: 12px; }
  .ov-stat b { color: var(--gold); font-size: 16px; margin-right: 3px; }
  .ov-players {
    flex: 0 0 100%;
    display: flex; gap: 8px; flex-wrap: wrap;
  }

  .round-list { display: flex; flex-direction: column; gap: 10px; }
  .round-card {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(212,175,55,.3);
    border-radius: 12px;
    padding: 12px 16px;
    flex-wrap: nowrap;      /* 横屏不换行 */
  }
  .rc-num { flex: 0 0 40px; font-weight: 900; color: var(--gold); font-size: 15px; }
  .rc-meta { font-size: 11px; color: #cfe0d6; opacity: .85; line-height: 1.5; word-break: break-all; flex-wrap: wrap; }
  .rc-badge { flex: 0 0 auto; padding: 3px 12px; border-radius: 20px; font-size: 13px; font-weight: 900; }
  .rc-badge.hu  { background: linear-gradient(180deg, #f15a48, #c93025); color: #fff; }
  .rc-badge.pao { background: linear-gradient(180deg, #f2a33c, #d97a14); color: #fff; }
  .rc-badge.liu { background: rgba(127,140,141,.3); color: #c2ccd0; }
  .rc-winner { flex: 0 0 auto; font-size: 14px; opacity: .9; }
  .rc-hand { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
  .rc-tiles { display: inline-flex; gap: 2px; flex-wrap: nowrap; align-items: center; }  /* 严禁换行 */
  .rc-tile { width: 22px; height: 30px; object-fit: cover; border-radius: 3px; vertical-align: middle; }
  .rc-meld { display: inline-flex; align-items: center; gap: 1px; margin-left: 4px; font-size: 10px; color: #e8d5a0; }
  .rc-fan { flex: 0 0 auto; font-size: 12px; color: #e8d5a0; }
  .rc-score { flex: 0 0 auto; font-size: 19px; font-weight: 900; }
  .rc-score.win { color: #7fe0a6; }
  .rc-score.lose { color: #ff6b5e; }
  .rc-score.zero { color: #c2ccd0; }
  .rc-win-tile { display: inline-flex; align-items: center; }
  .rc-win-tile .rc-tile { box-shadow: 0 0 0 2px rgba(247,215,116,.9); border-radius: 4px; }

  @media (max-width: 640px) {
    .card .pnl { flex: 0 0 86px; font-size: 24px; }
  }
</style>
<style>
  .round-list .round-card { align-items: stretch; }
  .round-list .rc-tile { width: 22px; height: 29px; object-fit: cover; border-radius: 3px; vertical-align: middle; }
  .round-list .rc-meld { display: inline-flex; align-items: center; gap: 1px; margin-right: 4px; font-size: 11px; color: #e8d5a0; }
  .round-list .rc-pl { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; opacity: .95; }
  .round-list .rc-pl.hu { opacity: 1; font-weight: bold; }
  .round-list .rc-pl .rc-fan { color: #e8d5a0; }
  .round-list .rc-pl .rc-hand { display: inline-flex; flex-wrap: wrap; gap: 1px; align-items: center; }
</style>
</head>
<body>
<header>
  <a class="back" href="lobby.html">‹ 大厅</a>
  <h1>战绩</h1>
</header>

<main id="list">
  <div class="empty">加载中…</div>
</main>

<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="dialog-head">
      <div class="overview" id="overview"></div>
      <button class="close" id="close">×</button>
    </div>
    <div class="dialog-body" id="rounds"></div>
  </div>
</div>

<script>
"use strict";
const ZI = ['东','南','西','北','中','发','白'];
const HUA = ['春','夏','秋','冬','梅','兰','竹','菊'];
function cardName(i){
  if (i < 9)  return (i+1) + '万';
  if (i < 18) return (i-8) + '筒';
  if (i < 27) return (i-17) + '条';
  if (i < 34) return ZI[i-27];
  return HUA[i-34];
}
const SEAT = ['东','南','西','北'];
const MELD_LABEL = {CHI:'吃', PENG:'碰', GANG:'杠', AN_GANG:'暗杠', BU_GANG:'补杠'};
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tImg(t){ return `<img class="rc-tile" src="img/tiles/${t}.png" title="${cardName(t)}">`; }
function meldHtml2(m){ return `<span class="rc-meld">${MELD_LABEL[m.type] || m.type}${(m.tiles || []).map(tImg).join('')}</span>`; }
function gangHtmlOf(d){
  return (d.gangs || []).map(g => `<span class="rc-meld">${MELD_LABEL[g.type] || g.type}${(g.tiles || []).map(tImg).join('')}</span>`).join('');
}
function flowerHtmlOf(d){
  return (d.flowers || []).map(f => tImg(f)).join('');
}
function flowerShown(d){
  // 只有凑成“花杠”(真花/假花/真对花/假对花) 才展示花牌图
  return ((d.notes || []).some(n => /花/.test(n)));
}
function rcScoreHtml(sc){
  const cls = sc > 0 ? 'win' : (sc < 0 ? 'lose' : 'zero');
  return `<span class="rc-score ${cls}">${sc > 0 ? '+' : ''}${sc}</span>`;
}

const userId = localStorage.getItem('userId') || '0';
const urlRoomId = new URLSearchParams(location.search).get('roomId');
const listEl = document.getElementById('list');
const overlay = document.getElementById('overlay');
const overviewEl = document.getElementById('overview');
const roundsEl = document.getElementById('rounds');

async function loadList(){
  try {
    const res = await fetch('/api/records?userId=' + userId);
    const data = await res.json();
    renderList(data.records || []);
  } catch (e) {
    listEl.innerHTML = '<div class="empty">加载失败，请确认后端已启动</div>';
  }
}

async function loadCurrentRoom(roomId){
  try {
    const res = await fetch('/api/records/byRoom?roomId=' + encodeURIComponent(roomId) + '&userId=' + userId);
    const data = await res.json();
    if (data.notFound) {
      listEl.innerHTML = '<div class="empty">本房间还没有完成的小局</div>';
    } else {
      listEl.innerHTML = '<div class="empty">当前房间战绩（从开始到现在）</div>';
      renderDetail(data);
      overlay.classList.add('open');
    }
  } catch (e) {
    listEl.innerHTML = '<div class="empty">加载失败，请确认后端已启动</div>';
  }
}

function renderList(records){
  if (!records.length) {
    listEl.innerHTML = '<div class="empty">暂无战绩，去打几把吧～</div>';
    return;
  }
  listEl.innerHTML = records.map(r => {
    const pnlCls = r.totalScore >= 0 ? 'win' : 'lose';
    const pnl = (r.totalScore >= 0 ? '+' : '') + r.totalScore;
    const time = fmtTime(r.startTime) + ' ~ ' + fmtTime(r.endTime);
    const rankCls = r.rank <= 4 ? 'r' + r.rank : '';
    return `<div class="card">
      <div class="pnl ${pnlCls}">${pnl}</div>
      <div class="mid">
        <div class="room">${r.roomId || ''}</div>
        <div class="meta">${time}</div>
      </div>
      <div class="rank ${rankCls}">第${r.rank}名</div>
      <button class="btn-detail" data-id="${r.sessionId}">查看详情</button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.btn-detail').forEach(b => {
    b.addEventListener('click', () => openDetail(b.dataset.id));
  });
}

async function openDetail(sessionId){
  try {
    const res = await fetch('/api/records/' + sessionId + '?userId=' + userId);
    const data = await res.json();
    renderDetail(data);
    overlay.classList.add('open');
  } catch (e) {
    alert('加载详情失败');
  }
}

function renderDetail(data){
  const ov = data.overview || {};
  const me = (ov.players || []).find(p => p.isMe) || {};
  const myTotal = me.total || 0;
  const players = (ov.players || []).map(p =>
    `<span class="player-tag ${p.isMe ? 'me' : ''}">${p.nickname || '玩家'}：${p.total}</span>`
  ).join('');
  overviewEl.innerHTML = `
    <div class="ov-title">房间 ${data.roomId || ''}</div>
    <div class="ov-hero">
      <div class="ov-me">
        <div class="ov-avatar">雀</div>
        <div class="ov-total">${myTotal >= 0 ? '+' : ''}${myTotal}</div>
      </div>
      <div class="ov-stats">
        <div class="ov-stat">胡牌 <b>${ov.winCount || 0}</b> 次</div>
        <div class="ov-stat">最高番型 <b>${ov.highestFan || '无'}</b></div>
      </div>
    </div>
    <div class="ov-players">${players}</div>`;

  const rounds = data.rounds || [];
  const WIND = ['东','南','西','北'];
  const SEAT = {EAST:'东', SOUTH:'南', WEST:'西', NORTH:'北'};
  const metaOf = (r) => {
    const bits = [];
    bits.push('庄 ' + (SEAT[r.dealerSeat] || '?') + (r.dealerNickname ? '·' + esc(r.dealerNickname) : ''));
    if (r.windIdx != null) bits.push('令 ' + (WIND[r.windIdx] || '?'));
    if (!r.isDraw && r.winType === 1 && r.loser && r.winTile != null) bits.push('点炮 ' + esc(r.loser) + ' 打 ' + cardName(r.winTile));
    return bits.length
      ? '<div class="rc-meta">' + bits.join('　') + '</div>' : '';
  };
  let cards = '';
  rounds.forEach(r => {
    if (r.isDraw) {
      cards += `<div class="round-card" style="display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap"><span class="rc-num">${r.roundNum}</span><div class="rc-ppl" style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px">${metaOf(r)}<span class="rc-winner">荒庄</span></div></div>`;
      return;
    }
    const ps = r.participants || [];
    const row = (p, kind) => {
      const d = p.detail || {};
      const notes = (d.notes || []).join('、');
      const sc = p.scoreChange || 0;
      const you = p.isMe ? '（我）' : '';
      let tiles = '';
      if (kind === 'hu') {
        // 胡牌者：手牌 + 副露（含杠牌，不重复展示 detail.gangs）
        tiles += (r.winHand || []).map(tImg).join('');
        tiles += (r.winMelds || []).map(meldHtml2).join('');
      } else {
        tiles += gangHtmlOf(d);
      }
      if (flowerShown(d)) tiles += flowerHtmlOf(d);   // 只有凑成花杠才显示花
      return `<div class="rc-pl ${kind}"><b>${kind === 'hu' ? '胡·' : ''}${esc(p.nickname || '')}${you}</b>`
        + (notes ? ` <span class="rc-fan">${esc(notes)}</span>` : '')
        + (tiles ? ` <span class="rc-hand">${tiles}</span>` : '')
        + rcScoreHtml(sc) + `</div>`;
    };
    const lines = [];
    ps.filter(p => p.isWinner).forEach(p => lines.push(row(p, 'hu')));
    ps.filter(p => !p.isWinner
        && (((p.detail || {}).gangs || []).length || ((p.detail || {}).notes || []).length))
      .forEach(p => lines.push(row(p, '')));
    cards += `<div class="round-card" style="display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap">
      <span class="rc-num">${r.roundNum}</span>
      <div class="rc-ppl" style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px">${metaOf(r)}${lines.join('')}</div>
    </div>`;
  });
  roundsEl.innerHTML = `<div class="round-list">${cards}</div>`;
}

function fmtTime(t){
  if (!t) return '—';
  const s = String(t).replace('T', ' ').slice(5, 16);
  return s;
}

document.getElementById('close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('open');
});

if (urlRoomId) {
  document.querySelector('.back').href = 'game.html';
  document.querySelector('.back').textContent = '‹ 返回对局';
  loadCurrentRoom(urlRoomId);
} else {
  loadList();
}
</script>
<script>
// APK(WebView/HBuilder)：安卓返回键 → 有历史网页后退，否则退出应用
(function(){
  function onBack(){
    if (window.history && window.history.length > 1) { try { window.history.back(); return; } catch (e) {} }
    if (typeof plus !== 'undefined' && plus.runtime) { try { plus.runtime.quit(); } catch (e) {} }
  }
  if (typeof plus !== 'undefined' && plus.key) { plus.key.addEventListener('backbutton', onBack); }
})();
</script>

</body>
</html>
